#ql-onb .ob-steps{list-style:none;padding:0;margin:.4rem 0 0;width:100%;max-width:22rem;max-height:30vh;overflow:auto;text-align:left;font-size:.92rem;color:var(--muted-fg,#aaa)}
#ql-onb .ob-steps li{padding:.22rem 0}
#ql-onb .ob-steps li:before{content:"✓ ";color:var(--primary);font-weight:700}
.pp-row{display:flex;align-items:center;gap:.6rem;background:var(--surface);border-radius:.9rem;padding:.65rem .7rem;margin-bottom:.45rem}
.pp-row.done .pp-t{opacity:.55;text-decoration:line-through}
.pp-chk{flex:none;width:1.7rem;height:1.7rem;border-radius:.5rem;border:1.5px solid var(--primary);background:transparent;color:var(--primary-fg);font-weight:800;cursor:pointer;padding:0}
.pp-row.done .pp-chk{background:var(--primary)}
.pp-t{flex:1;min-width:0;font-size:.95rem;overflow-wrap:anywhere}
.pp-a{flex:none;text-decoration:none;font-size:.85rem;font-weight:600;border-radius:999px;padding:.4rem .8rem;background:var(--primary);color:var(--primary-fg)}
.pp-a.alt{background:var(--surface-2);color:var(--foreground)}
button.pp-a{border:0;font-family:inherit;cursor:pointer}
.pp-crs{flex:none;width:2rem;height:2rem;border-radius:999px;border:0;background:var(--surface-2);font-size:1rem;line-height:1;cursor:pointer;padding:0}
.pp-crs.has{background:var(--primary)}
.pp-del{flex:none;background:none;border:0;color:var(--muted-fg,#aaa);font-size:1.25rem;line-height:1;cursor:pointer;padding:.2rem .3rem}
.ap-l{display:block;margin:.95rem 0 .35rem;font-size:.9rem;color:var(--muted-fg,#aaa)}
.ap-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.ap-chip{background:var(--surface);border:1.5px solid transparent;color:inherit;font:inherit;font-size:.92rem;border-radius:999px;padding:.55rem .95rem;cursor:pointer}
.ap-chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.ap-or{text-align:center;color:var(--muted-fg,#aaa);font-size:.8rem;margin:.45rem 0}
.ap-file{width:100%}
.ap-actions{display:flex;gap:.6rem;margin-top:1.2rem}
.ap-actions .btn{flex:1}
.pp-sum{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin:.2rem 1.1rem .8rem;padding:.8rem 1rem;border-radius:1.1rem;background:var(--surface)}
.pp-sum b{display:block;font-size:1.02rem}
.pp-sum small{color:var(--muted-fg,#aaa)}
.pp-edit{background:var(--surface-2);color:inherit;border:0;border-radius:999px;padding:.45rem .9rem;font:inherit;font-size:.9rem;cursor:pointer}
.pp-tip{position:relative;margin:0 1.1rem .8rem;padding:.9rem 2.3rem .9rem 1rem;border-radius:1.1rem;background:var(--surface-2);font-size:.92rem}
.pp-tip ol{margin:.4rem 0 0 1.1rem;padding:0}
.pp-tip li{margin:.2rem 0}
.pp-x{position:absolute;top:.3rem;right:.4rem;background:none;border:0;color:inherit;font-size:1.3rem;cursor:pointer;padding:.3rem}
.pp-subj .pp-bar{display:block;height:.3rem;border-radius:9px;background:var(--surface-2);margin-top:.45rem;overflow:hidden}
.pp-subj .pp-bar i{display:block;height:100%;background:var(--primary)}
.pp-chev{margin-left:auto;font-size:1.5rem;color:var(--muted-fg,#aaa);padding-left:.4rem}
.pp-tabs{display:flex;gap:.3rem;background:var(--surface);border-radius:999px;padding:.25rem;margin-bottom:.8rem}
.pp-tab{flex:1;border:0;background:none;color:inherit;font:inherit;font-size:.9rem;padding:.5rem .2rem;border-radius:999px;cursor:pointer;white-space:nowrap}
.pp-tab i{font-style:normal;font-size:.72rem;margin-left:.3rem;opacity:.75}
.pp-tab.on{background:var(--primary);color:var(--primary-fg)}
.pp-card{background:var(--surface);border-radius:1.1rem;padding:.85rem;margin-bottom:.6rem}
.pp-card.done .pp-ct b{opacity:.6}
.pp-ct{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}
.pp-ct b{font-size:1rem;overflow-wrap:anywhere}
.pp-done{flex:none;border:1.5px solid var(--primary);background:none;color:inherit;border-radius:999px;padding:.35rem .75rem;font:inherit;font-size:.82rem;cursor:pointer}
.pp-done.on{background:var(--primary);color:var(--primary-fg)}
.pp-btns{display:flex;gap:.5rem;margin:.7rem 0 .5rem}
.pp-btns .pp-a{flex:1;text-align:center;padding:.6rem .5rem;font-size:.9rem}
.pp-mk{display:flex;align-items:center;gap:.7rem;width:100%;background:var(--surface-2);border:0;color:inherit;font:inherit;text-align:left;border-radius:.9rem;padding:.65rem .8rem;cursor:pointer}
.pp-mk>span:first-child{font-size:1.4rem}
.pp-mk small{display:block;color:var(--muted-fg,#aaa);font-size:.8rem}
.pp-mk.has{outline:1.5px solid var(--primary)}
.pp-rm{background:none;border:0;color:var(--muted-fg,#aaa);font:inherit;font-size:.8rem;margin-top:.5rem;padding:.2rem 0;cursor:pointer;text-decoration:underline}
.pp-empty{text-align:center;padding:1.2rem .6rem;background:var(--surface);border-radius:1.1rem}
.pp-empty p{margin:.2rem 0}
.pp-skill{margin-top:1rem;padding:.9rem;border-radius:1.1rem;background:var(--surface)}
.pp-skill p{margin:.2rem 0 .7rem}
.ap-seg{display:flex;background:var(--surface);border-radius:999px;padding:.25rem}
.ap-seg button{flex:1;border:0;background:none;color:inherit;font:inherit;font-size:.9rem;padding:.55rem;border-radius:999px;cursor:pointer}
.ap-seg button.on{background:var(--primary);color:var(--primary-fg)}
.ap-drop{display:block;width:100%;margin-top:.6rem;border:2px dashed var(--surface-2);background:none;color:inherit;font:inherit;border-radius:1rem;padding:1rem;cursor:pointer;text-align:center}
.ap-drop small{display:block;color:var(--muted-fg,#aaa);font-size:.8rem;margin-top:.2rem}
.ap-drop.ok{border-style:solid;border-color:var(--primary)}
.ap-more{background:none;border:0;color:var(--primary);font:inherit;font-size:.95rem;margin-top:1rem;padding:.3rem 0;cursor:pointer}
#apLinkBox,#apmLinkBox{margin-top:.6rem}
.sh [hidden]{display:none!important}
</style>
<script>
(function(){
"use strict";
const PREP_MIN_MS=6000; /* shortest time the "preparing your account" screen stays up */
const $=id=>document.getElementById(id);
const E=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const LANGS={en:"English",af:"Afrikaans",es:"Spanish",fr:"French"};
const COUNTRIES=[
 {id:"ZA",name:"South Africa",flag:"🇿🇦",label:"Grade",grades:rng(4,12),langs:["en","af"]},
 {id:"US",name:"United States",flag:"🇺🇸",label:"Grade",grades:rng(3,12),langs:["en","es"]},
 {id:"GB",name:"United Kingdom",flag:"🇬🇧",label:"Year",grades:rng(3,13),langs:["en"]},
 {id:"AU",name:"Australia",flag:"🇦🇺",label:"Year",grades:rng(3,12),langs:["en"]},
 {id:"CA",name:"Canada",flag:"🇨🇦",label:"Grade",grades:rng(3,12),langs:["en","fr"]},
 {id:"OTHER",name:"Somewhere else",flag:"🌍",label:"Grade",grades:rng(3,12),langs:["en"]}
];
const cOf=id=>COUNTRIES.find(x=>x.id===id);
function subjectsFor(cid,g,lang){
 const S=(id,name,emoji)=>({id,name,emoji});
 if(cid==="ZA"){
  const hl=LANGS[lang]||"English",fal=lang==="af"?"English":"Afrikaans";
  const core=[S("hl",hl+" Home Language","📖"),S("fal",fal+" First Additional Language","💬")];
  if(g<=6)return core.concat([S("maths","Mathematics","➗"),S("ns","Natural Sciences & Technology","🔬"),S("ss","Social Sciences","🌍"),S("ls","Life Skills","🌱")]);
  if(g<=9)return core.concat([S("maths","Mathematics","➗"),S("ns","Natural Sciences","🔬"),S("geo","Social Sciences: Geography","🗺️"),S("hist","Social Sciences: History","🏛️"),S("tech","Technology","⚙️"),S("ems","Economic & Management Sciences","💼"),S("lo","Life Orientation","🧭"),S("arts","Creative Arts","🎨")]);
  return core.concat([S("maths","Mathematics","➗"),S("mathlit","Mathematical Literacy","🧮"),S("techmaths","Technical Mathematics","📐"),S("lo","Life Orientation","🧭"),S("physci","Physical Sciences","⚗️"),S("lifesci","Life Sciences","🧬"),S("geo","Geography","🗺️"),S("hist","History","🏛️"),S("acc","Accounting","📒"),S("bus","Business Studies","💼"),S("econ","Economics","📈"),S("cat","Computer Applications Technology","💻"),S("it","Information Technology","🖥️"),S("egd","Engineering Graphics & Design","📏"),S("agri","Agricultural Sciences","🌾"),S("consumer","Consumer Studies","🍳"),S("tourism","Tourism","🧳"),S("drama","Dramatic Arts","🎭"),S("visual","Visual Arts","🖼️"),S("music","Music","🎵"),S("relig","Religion Studies","🕊️"),S("hosp","Hospitality Studies","🍽️")]);
 }
 const nat=LANGS[lang]||"English";
 if(g<=8)return [S("ela",nat+" Language Arts","📖"),S("maths","Mathematics","➗"),S("science","Science","🔬"),S("social","Social Studies","🌍"),S("pe","Physical Education","🏃"),S("arts","Arts","🎨")];
 return [S("ela",nat+" Language Arts","📖"),S("maths","Mathematics","➗"),S("bio","Biology","🧬"),S("chem","Chemistry","⚗️"),S("phys","Physics","⚛️"),S("hist","History","🏛️"),S("geo","Geography","🗺️"),S("econ","Economics","📈"),S("cs","Computer Science","💻"),S("lang2","Second Language","💬")];
}
const okUrl=u=>typeof u==="string"&&/^https?:\/\//i.test(u.trim());
const gLabel=(c,g)=>(c?c.label:"Grade")+" "+g;

/* ---------- state + overlay ---------- */
let S=null;
function overlay(){let o=$("ql-onb");if(!o){o=document.createElement("div");o.id="ql-onb";document.body.appendChild(o)}return o}
function hideApp(on){const nav=document.querySelector("nav.bottom"),sh=document.querySelector(".shell");if(nav)nav.style.display=on?"none":"";if(sh)sh.style.visibility=on?"hidden":""}
function stepsOf(){const c=cOf(S.country);return ["country","grade"].concat(c&&c.langs.length>1?["lang"]:[]).concat(["subjects"])}
window.qlStartOnboarding=function(){
 const p=data.profile&&!data.profile.skipped?data.profile:{};
 S={idx:0,country:p.country||null,grade:p.grade||null,lang:p.lang||null,subs:new Set(p.subjects||[]),edit:!!p.country};
 hideApp(true);draw();
};
function close(){const o=$("ql-onb");if(o)o.remove();hideApp(false)}
function draw(){
 const o=overlay(),steps=stepsOf(),st=steps[S.idx],c=cOf(S.country),n=steps.length;
 let title="",sub="",body="",canNext=false;
 if(st==="country"){
  title="Where do you study?";sub="We'll match papers to your curriculum.";
  body=COUNTRIES.map(x=>`<button class="ob-opt ${S.country===x.id?"on":""}" data-k="country" data-v="${x.id}"><span class="em">${x.flag}</span><b>${E(x.name)}</b></button>`).join("");
  canNext=!!S.country;
 }else if(st==="grade"){
  title="Which "+c.label.toLowerCase()+" are you in?";sub="";
  body='<div class="ob-grid">'+c.grades.map(g=>`<button class="ob-chip ${S.grade===g?"on":""}" data-k="grade" data-v="${g}">${E(gLabel(c,g))}</button>`).join("")+"</div>";
  canNext=!!S.grade;
 }else if(st==="lang"){
  title="Which language do you study in?";sub="Papers are loaded in this language where they exist.";
  body=c.langs.map(l=>`<button class="ob-opt ${S.lang===l?"on":""}" data-k="lang" data-v="${l}"><b>${E(LANGS[l]||l)}</b></button>`).join("");
  canNext=!!S.lang;
 }else{
  const list=subjectsFor(S.country,S.grade,S.lang);
  title="Pick your subjects";sub="We'll set up a course for each one, with Term 1–4 papers.";
  body=`<div class="ob-grid">${list.map(x=>`<button class="ob-chip ${S.subs.has(x.id)?"on":""}" data-k="sub" data-v="${x.id}"><span>${x.emoji}</span>${E(x.name)}</button>`).join("")}</div><div style="margin-top:.8rem"><button class="ob-link" data-k="all" style="padding-left:0">${S.subs.size===list.length?"Clear all":"Select all"}</button></div>`;
  canNext=S.subs.size>0;
 }
 const last=S.idx===n-1;
 o.innerHTML=`<div class="ob-top"><div class="ob-dots">${steps.map((_,i)=>`<i class="${i<=S.idx?"on":""}"></i>`).join("")}</div><button class="ob-link" data-k="skip">${S.edit?"Cancel":"Skip for now"}</button></div>
 <div class="ob-main"><h1>${E(title)}</h1>${sub?`<p class="ob-sub">${E(sub)}</p>`:""}${body}</div>
 <div class="ob-foot">${S.idx>0?'<button class="btn btn-secondary" data-k="back">Back</button>':""}<button class="btn btn-primary" data-k="next" ${canNext?"":"disabled"}>${last?"Set up my account":"Continue"}</button></div>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest&&e.target.closest("#ql-onb [data-k]");if(!b||!S)return;
 const k=b.dataset.k,v=b.dataset.v,steps=stepsOf();
 if(k==="country"){S.country=v;S.grade=null;S.subs=new Set();const c=cOf(v);S.lang=c.langs.length===1?c.langs[0]:null;draw();setTimeout(()=>{if(S&&S.country===v){S.idx=1;draw()}},140)}
 else if(k==="grade"){S.grade=Number(v);S.subs=new Set();draw();setTimeout(()=>{if(S&&S.grade===Number(v)){S.idx=Math.min(S.idx+1,stepsOf().length-1);draw()}},140)}
 else if(k==="lang"){S.lang=v;S.subs=new Set();draw();setTimeout(()=>{if(S&&S.lang===v){S.idx=Math.min(S.idx+1,stepsOf().length-1);draw()}},140)}
 else if(k==="sub"){S.subs.has(v)?S.subs.delete(v):S.subs.add(v);draw()}
 else if(k==="all"){const list=subjectsFor(S.country,S.grade,S.lang);S.subs=S.subs.size===list.length?new Set():new Set(list.map(x=>x.id));draw()}
 else if(k==="back"){S.idx=Math.max(0,S.idx-1);draw()}
 else if(k==="next"){if(S.idx<steps.length-1){S.idx++;draw()}else prepare()}
 else if(k==="skip"){if(!S.edit){data.profile={skipped:true};save()}S=null;close();try{route()}catch(_){}}
});

/* ---------- paper catalogue (built-in list + optional papers.json) ---------- */
async function loadRemote(){
 const url=window.QL_PAPERS_URL;if(!url||!window.fetch)return;
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),4000);
 try{
  const r=await fetch(url,{cache:"no-cache",signal:ctl.signal});
  if(!r.ok)return;
  const j=await r.json();
  if(Array.isArray(j))j.forEach(p=>window.QL_PAPERS.push(p));
 }catch(_){}finally{clearTimeout(t)}
}
function papersFor(pr,sid){
 return (window.QL_PAPERS||[]).filter(p=>p&&p.country===pr.country&&Number(p.grade)===pr.grade&&p.subject===sid&&[1,2,3,4].includes(Number(p.term))&&okUrl(p.url)&&(!p.lang||p.lang==="any"||p.lang===pr.lang));
}

/* ---------- account preparation ---------- */
async function prepare(){
 const o=overlay(),c=cOf(S.country),subs=subjectsFor(S.country,S.grade,S.lang).filter(x=>S.subs.has(x.id));
 const pr={country:S.country,grade:S.grade,lang:S.lang,subjects:subs.map(x=>x.id),at:Date.now()};
 const t0=Date.now();
 const face=(typeof mascot==="function"&&typeof animOn==="function"&&animOn())?mascot("think",{size:112,cls:"idle"}):"";
 o.innerHTML=`<div class="ob-prep">${face}<h1>Setting up your account</h1><p class="ob-sub" id="obMsg">Saving your details…</p><div class="ob-bar"><i id="obBar"></i></div><ul class="ob-steps" id="obSteps"></ul></div>`;
 const msg=t=>{const m=$("obMsg");if(m)m.textContent=t};
 const bar=p=>{const b=$("obBar");if(b)b.style.width=Math.round(p*100)+"%"};
 const li=t=>{const u=$("obSteps");if(!u)return;const x=document.createElement("li");x.textContent=t;u.appendChild(x);u.scrollTop=u.scrollHeight};
 const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
 bar(.05);await sleepMs(250);
 li(`${gLabel(c,pr.grade)} · ${c.name} · ${LANGS[pr.lang]||""}`);
 msg("Checking for new papers…");bar(.12);
 await loadRemote();
 const old=new Map(),oldCustom={};
 (data.paperCourses||[]).forEach(pc=>{pc.papers.forEach(p=>old.set(pc.id+"|"+p.key,p));oldCustom[pc.subject]=pc.papers.filter(p=>p.custom)});
 let total=0;const courses=[];
 for(let i=0;i<subs.length;i++){
  const s=subs[i],id="pc_"+s.id;
  msg("Building "+s.name+"…");
  const seen=new Set(),papers=[];
  papersFor(pr,s.id).forEach(p=>{
   const key=p.term+"|"+p.title+"|"+p.url;if(seen.has(key))return;seen.add(key);
   const prev=old.get(id+"|"+key);
   papers.push({id:prev?prev.id:"p"+Math.random().toString(36).slice(2,9),key,term:Number(p.term),title:String(p.title||"Paper"),url:p.url.trim(),memo:okUrl(p.memo)?p.memo.trim():"",done:prev?!!prev.done:false,fileId:prev?prev.fileId:undefined,fileName:prev?prev.fileName:undefined,courseDeck:prev?prev.courseDeck:undefined});
  });
  (oldCustom[s.id]||[]).forEach(p=>{papers.push(p);delete oldCustom[s.id]});
  papers.sort((a,b)=>a.term-b.term||a.title.localeCompare(b.title));
  total+=papers.length;
  courses.push({id,subject:s.id,name:s.name,emoji:s.emoji,papers});
  li(s.name+(papers.length?" · "+papers.length+" paper"+(papers.length===1?"":"s"):" · ready"));
  bar(.15+.8*((i+1)/subs.length));
  await sleepMs(220);
 }
 Object.values(oldCustom).forEach(l=>(l||[]).forEach(p=>fileIds(p).forEach(f=>idbDel(f).catch(()=>{}))));
 data.paperCourses=courses;data.profile=pr;save();
 msg("Finishing up…");bar(1);
 const wait=PREP_MIN_MS-(Date.now()-t0);if(wait>0)await sleepMs(wait);
 S=null;close();
 try{exTab="papers"}catch(_){}
 try{toast(total?"Your papers are ready":"Your courses are ready. Papers appear as they're added.")}catch(_){}
 try{if(location.hash==="#/study")route();else go("#/study")}catch(_){}
}

/* ---------- Exams > My papers ---------- */
const curTerm=()=>[1,1,1,2,2,2,3,3,3,4,4,4][new Date().getMonth()];
const PT={}; /* term shown in each subject sheet */
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
window.ppHideTip=function(){try{localStorage.setItem("ql-papers-tip","1")}catch(_){}try{renderStudy()}catch(_){}};
window.papersBody=function(){
 const p=data.profile;
 if(!p||p.skipped||!p.country)return `<div class="empty2" style="padding:2.5rem 1.4rem"><p style="font-size:1.05rem">Set up your grade to get past papers for every subject.</p><button class="btn btn-primary" style="margin-top:1rem" onclick="qlStartOnboarding()">Set up my papers</button></div>`;
 const c=cOf(p.country)||{name:p.country,flag:"",label:"Grade"},cs=data.paperCourses||[];
 let t=0,d=0;cs.forEach(x=>x.papers.forEach(q=>{t++;if(q.done)d++}));
 let tip="";try{if(!localStorage.getItem("ql-papers-tip"))tip=`<div class="pp-tip"><button class="pp-x" onclick="ppHideTip()" aria-label="Dismiss">×</button><b>How this works</b><ol><li>Tap a subject below.</li><li>Add your papers: upload a file or paste a link.</li><li>Tap <b>Make a course</b> on a paper to turn it into lessons.</li></ol></div>`}catch(_){}
 const rows=cs.map(pc=>{
  const tot=pc.papers.length,dn=pc.papers.filter(x=>x.done).length,pct=tot?Math.round(dn/tot*100):0;
  return `<button class="row2 pp-subj" onclick="openPaperCourse('${pc.id}')"><span class="tile" style="background:#3b290f">${pc.emoji}</span><span class="t"><b>${E(pc.name)}</b><small>${tot?plural(tot,"paper")+" · "+dn+" done":"No papers yet · tap to add"}</small>${tot?`<span class="pp-bar"><i style="width:${pct}%"></i></span>`:""}</span><span class="pp-chev">›</span></button>`;
 }).join("");
 return `<div class="pp-sum"><div><b>${E(c.flag||"")} ${E(gLabel(c,p.grade))}</b><small>${E(c.name)} · ${E(LANGS[p.lang]||"")}</small></div><button class="pp-edit" onclick="qlStartOnboarding()">Edit</button></div>${tip}<div style="padding:0 1.1rem .8rem"><button class="btn btn-primary" style="width:100%" onclick="openAddPaper()">＋ Add a paper</button><p class="muted" style="text-align:center;margin:.45rem 0 0">${t?plural(t,"paper")+" · "+d+" done":"Nothing added yet"}</p></div><div class="lbl">Your subjects</div><div class="rows" style="padding-top:0">${rows}</div>`;
};
const fileIds=p=>[p.fileId,p.memoFileId].filter(Boolean);
function lnk(label,url,fid,alt){
 const c="pp-a"+(alt?" alt":"");
 return fid?`<button class="${c}" onclick="openPaperFile('${fid}')">${label}</button>`:`<a class="${c}" href="${E(url)}" target="_blank" rel="noopener">${label}</a>`;
}
function ppCard(pc,p){
 const has=!!p.courseDeck;
 const open=(p.url||p.fileId)?lnk("Open paper",p.url,p.fileId,false):"";
 const ans=(p.memo||p.memoFileId)?lnk("Answers",p.memo,p.memoFileId,true):"";
 return `<div class="pp-card ${p.done?"done":""}"><div class="pp-ct"><b>${E(p.title)}</b><button class="pp-done ${p.done?"on":""}" onclick="togglePaper('${pc.id}','${p.id}')">${p.done?"✓ Done":"Mark done"}</button></div><div class="pp-btns">${open}${ans}</div><button class="pp-mk ${has?"has":""}" onclick="createPaperCourse('${pc.id}','${p.id}')"><span>🎓</span><span><b>${has?"Open course":"Make a course"}</b><small>${has?"Keep learning from this paper":"Turns this paper into lessons"}</small></span></button>${p.custom?`<button class="pp-rm" onclick="removePaper('${pc.id}','${p.id}')">Remove this paper</button>`:""}</div>`;
}
window.openPaperCourse=function(id,term){
 const pc=(data.paperCourses||[]).find(x=>x.id===id);if(!pc)return;
 if(term)PT[id]=term;
 let t=PT[id];
 if(!t){t=pc.papers.some(p=>p.term===curTerm())?curTerm():((pc.papers[0]&&[1,2,3,4].find(x=>pc.papers.some(p=>p.term===x)))||curTerm());PT[id]=t}
 const tot=pc.papers.length,dn=pc.papers.filter(x=>x.done).length;
 const tabs=[1,2,3,4].map(x=>{const n=pc.papers.filter(p=>p.term===x).length;return `<button class="pp-tab ${x===t?"on":""}" onclick="openPaperCourse('${id}',${x})">Term ${x}${n?`<i>${n}</i>`:""}</button>`}).join("");
 const ps=pc.papers.filter(p=>p.term===t);
 const cards=ps.length?ps.map(p=>ppCard(pc,p)).join(""):`<div class="pp-empty"><p><b>No Term ${t} papers yet</b></p><p class="muted">Add a past paper to practise it and turn it into a course.</p></div>`;
 const pl=prepLabel(pc),skill=/lessons/.test(pl)?"Continue · "+pl.split("· ")[1]:"Start the course";
 modal(`<div class="sh"><h2>${pc.emoji} ${E(pc.name)}</h2><p class="muted" style="margin:.1rem 0 .8rem">${tot?plural(tot,"paper")+" · "+dn+" done":"No papers yet"}</p><div class="pp-tabs">${tabs}</div>${cards}<button class="btn btn-primary" style="width:100%;margin-top:.8rem" onclick="openAddPaper('${pc.subject}',${t})">＋ Add a Term ${t} paper</button><div class="pp-skill"><b>🎯 Exam skills course</b><p class="muted">Learn how to read questions, plan your time and score more marks in ${E(pc.name)}.</p><button class="btn btn-secondary" style="width:100%" onclick="openPaperPrep('${pc.subject}')">${E(skill)}</button></div><button class="btn btn-ghost" style="width:100%;margin-top:.4rem" onclick="closeModal()">Close</button></div>`);
};
/* ---------- add your own papers (link or uploaded file) ---------- */
let AP=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("ql-paper-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction("f").objectStore("f").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
window.openAddPaper=function(sid,term){
 const cs=data.paperCourses||[];
 if(!cs.length){try{toast("Set up your subjects first")}catch(_){}return}
 AP={subject:cs.some(c=>c.subject===sid)?sid:cs[0].subject,term:term||curTerm(),file:null,memoFile:null,mode:"file",memoMode:"file"};
 const seg=(id,w)=>`<div class="ap-seg" id="${id}"><button class="on" data-m="file" onclick="apMode('${w}','file')">📎 Upload a file</button><button data-m="link" onclick="apMode('${w}','link')">🔗 Paste a link</button></div>`;
 modal(`<div class="sh"><h2>Add a paper</h2>
 <label class="ap-l" for="apSub">Subject</label><select class="input" id="apSub" onchange="AP_subject(this.value)">${cs.map(c=>`<option value="${E(c.subject)}" ${c.subject===AP.subject?"selected":""}>${c.emoji} ${E(c.name)}</option>`).join("")}</select>
 <label class="ap-l">Which term?</label><div class="ap-chips" id="apTerm">${[1,2,3,4].map(t=>`<button class="ap-chip ${t===AP.term?"on":""}" data-t="${t}" onclick="apTerm(${t})">Term ${t}</button>`).join("")}</div>
 <label class="ap-l">Where is the paper?</label>${seg("apSeg","paper")}
 <div id="apFileBox"><button class="ap-drop" id="apFileBtn" onclick="apPick('file')">Choose a PDF or photo<small>from your phone or computer</small></button></div>
 <div id="apLinkBox" hidden><input class="input" id="apUrl" type="url" inputmode="url" placeholder="https://…"></div>
 <label class="ap-l" for="apTitle">Name <span class="muted">(optional)</span></label><input class="input" id="apTitle" placeholder="e.g. Term 1 Test 2024" maxlength="80">
 <button class="ap-more" id="apMoreBtn" onclick="apMore()">＋ Add the answers / memo (optional)</button>
 <div id="apMemoBox" hidden><label class="ap-l">Answers / memo</label>${seg("apmSeg","memo")}
  <div id="apmFileBox"><button class="ap-drop" id="apmFileBtn" onclick="apPick('memoFile')">Choose a PDF or photo<small>the marking guideline</small></button></div>
  <div id="apmLinkBox" hidden><input class="input" id="apmUrl" type="url" inputmode="url" placeholder="https://…"></div></div>
 <div class="ap-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAddedPaper()">Add paper</button></div></div>`);
};
window.AP_subject=function(v){if(AP)AP.subject=v};
window.apTerm=function(t){if(!AP)return;AP.term=t;document.querySelectorAll("#apTerm .ap-chip").forEach(b=>b.classList.toggle("on",Number(b.dataset.t)===t))};
window.apMode=function(w,m){
 if(!AP)return;const pre=w==="paper"?"ap":"apm";
 AP[w==="paper"?"mode":"memoMode"]=m;
 const f=$(pre+"FileBox"),l=$(pre+"LinkBox");if(f)f.hidden=m!=="file";if(l)l.hidden=m!=="link";
 document.querySelectorAll("#"+pre+"Seg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
};
window.apMore=function(){const b=$("apMemoBox"),btn=$("apMoreBtn");if(!b)return;b.hidden=!b.hidden;if(btn)btn.textContent=b.hidden?"＋ Add the answers / memo (optional)":"− Hide the answers / memo"};
window.apPick=function(kind){
 if(!AP)return;
 const inp=document.createElement("input");inp.type="file";inp.accept=".pdf,application/pdf,image/*";
 inp.onchange=()=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>30*1024*1024){try{toast("That file is over 30 MB. Use a link instead.")}catch(_){}return}
  AP[kind]=f;
  const btn=$(kind==="file"?"apFileBtn":"apmFileBtn");
  if(btn){btn.classList.add("ok");btn.innerHTML="📎 "+E(f.name)+"<small>Tap to change</small>"}
 };
 inp.click();
};
window.saveAddedPaper=async function(){
 if(!AP)return;
 const val=id=>(($(id)||{}).value||"").trim();
 const sid=val("apSub")||AP.subject,url=val("apUrl"),memo=val("apmUrl"),useFile=AP.mode==="file",memoFile=AP.memoMode==="file";
 if(useFile&&!AP.file){toast("Choose a file, or switch to “Paste a link”");return}
 if(!useFile&&!url){toast("Paste the link to the paper");return}
 if(!useFile&&!okUrl(url)){toast("The link must start with http:// or https://");return}
 if(!memoFile&&memo&&!okUrl(memo)){toast("The memo link must start with http:// or https://");return}
 const pc=(data.paperCourses||[]).find(c=>c.subject===sid);if(!pc)return;
 const title=val("apTitle")||(useFile?AP.file.name.replace(/\.[^.]+$/,""):"Term "+AP.term+" paper");
 const id="p"+Math.random().toString(36).slice(2,9);
 const p={id,key:"custom|"+id,term:AP.term,title,url:useFile?"":url,memo:(!memoFile&&okUrl(memo))?memo:"",done:false,custom:true};
 try{
  if(useFile){p.fileId="f"+id;p.fileName=AP.file.name;await idbPut(p.fileId,{blob:AP.file,name:AP.file.name,type:AP.file.type})}
  if(memoFile&&AP.memoFile){p.memoFileId="m"+id;p.memoFileName=AP.memoFile.name;await idbPut(p.memoFileId,{blob:AP.memoFile,name:AP.memoFile.name,type:AP.memoFile.type})}
 }catch(_){toast("Couldn't save that file on this device. Try a link instead.");return}
 PT[pc.id]=AP.term;
 pc.papers.push(p);pc.papers.sort((a,b)=>a.term-b.term||a.title.localeCompare(b.title));
 save();AP=null;offerPaperCourse(pc.id,p.id);
 try{if(exTab==="papers"&&location.hash.startsWith("#/study"))renderStudy()}catch(_){}
};
window.openPaperFile=async function(fid){
 const w=window.open("","_blank");
 try{
  const rec=await idbGet(fid);
  if(!rec||!rec.blob)throw new Error("missing");
  const url=URL.createObjectURL(rec.blob);
  if(w)w.location.href=url;
  else{const a=document.createElement("a");a.href=url;a.download=rec.name||"paper";a.click()}
  setTimeout(()=>URL.revokeObjectURL(url),120000);
 }catch(_){if(w)w.close();try{toast("That file isn't on this device. Add it again.")}catch(__){}}
};
window.removePaper=function(cid,pid){
 const pc=(data.paperCourses||[]).find(x=>x.id===cid),p=pc&&pc.papers.find(x=>x.id===pid);if(!p)return;
 const go2=()=>{fileIds(p).forEach(f=>idbDel(f).catch(()=>{}));pc.papers=pc.papers.filter(x=>x.id!==pid);save();openPaperCourse(cid);try{if(exTab==="papers"&&location.hash.startsWith("#/study"))renderStudy()}catch(_){}};
 if(typeof askConfirm==="function")askConfirm("Remove this paper?","It will be removed from this course.","Remove",true).then(ok=>{if(ok)go2()});else go2();
};
window.togglePaper=function(cid,pid){
 const pc=(data.paperCourses||[]).find(x=>x.id===cid),p=pc&&pc.papers.find(x=>x.id===pid);if(!p)return;
 p.done=!p.done;save();openPaperCourse(cid);
 try{if(exTab==="papers"&&location.hash.startsWith("#/study"))renderStudy()}catch(_){}
};

/* ---------- past-paper courses: teach the student how to do well in their papers ---------- */
const PREP_UNITS=[
 ["Know your paper",["Layout & mark allocation","Planning your time","Command words decoded"]],
 ["Score more marks",["Showing your working","Using the memo to mark yourself","Mistakes that cost marks"]],
 ["Past-paper strategy",["Working through a full paper","Spotting repeated question types","Fixing your weak topics"]]
];
const ppKey=(pc,p)=>"pp_"+[p.country,p.grade,p.lang,pc.subject].join("_");
const ppTitle=(pc,p)=>gLabel(cOf(p.country),p.grade)+" "+pc.name+": past papers";
function ppNote(pc,p){
 const c=cOf(p.country)||{name:p.country};
 return "Past-paper preparation for "+gLabel(c,p.grade)+" "+pc.name+" ("+c.name+" school curriculum, studied in "+(LANGS[p.lang]||"English")+"). Write questions in the style, difficulty and wording of real school term tests and exams for this subject and grade, in "+(LANGS[p.lang]||"English")+". Lessons about exam technique must teach it through realistic questions from this subject. In each explanation, teach how to approach this kind of question, why the answer earns the marks, and one common mistake that loses marks.";
}
function registerPrep(c){ /* make sure lessons can find their question style after a reload */
 if(typeof EXAMS==="undefined"||!c||!c.paperPrep||!c.exam||EXAMS[c.exam])return;
 EXAMS[c.exam]={emoji:c.ppEmoji||"📄",name:c.title,sub:"Past-paper course",note:c.ppNote||"",units:[]};
}
try{Object.values(data.courses||{}).forEach(registerPrep)}catch(_){}
function prepDeckOf(pc){const p=data.profile;if(!p||!p.country)return null;const k=ppKey(pc,p);return (data.decks||[]).find(d=>d.examKey===k)||null}
window.prepLabel=function(pc){
 const d=prepDeckOf(pc),c=d&&courseOf(d.id);
 if(c&&c.units&&c.units.length){const tot=c.units.reduce((a,u)=>a+u.lessons.length,0),dn=Object.keys(c.done||{}).length;return "Past-paper course · "+dn+"/"+tot+" lessons"}
 return "Start the past-paper course";
};
window.openPaperPrep=function(sid){
 const pc=(data.paperCourses||[]).find(c=>c.subject===sid),p=data.profile;if(!pc||!p||!p.country)return;
 const key=ppKey(pc,p);
 let d=prepDeckOf(pc);
 if(!d){d=createDeck(pc.name+": past-paper course");if(!d)return;d.examKey=key;d.subject="Past papers"}
 data.courses=data.courses||{};
 let c=data.courses[d.id];
 if(!c||!c.units||!c.units.length){
  c=data.courses[d.id]={title:ppTitle(pc,p),exam:key,paperPrep:true,ppNote:ppNote(pc,p),ppEmoji:pc.emoji,done:{},units:PREP_UNITS.map(u=>({title:u[0],lessons:u[1].map(t=>({title:t,qs:[]}))}))};
 }
 registerPrep(c);save();closeModal();go("#/course/"+d.id);
};
function pcOfCourse(c){const p=data.profile;return p&&p.country?(data.paperCourses||[]).find(x=>ppKey(x,p)===c.exam):null}
async function paperImages(pc){
 const files=[];
 for(const x of pc.papers.filter(q=>q.fileId).slice(0,2)){
  try{const rec=await idbGet(x.fileId);if(rec&&rec.blob)files.push(new File([rec.blob],rec.name||"paper.pdf",{type:rec.type||rec.blob.type||""}))}catch(_){}
 }
 if(!files.length||typeof filesToImages!=="function")return [];
 try{return await filesToImages(files)}catch(_){return []}
}
window.buildPaperTopics=async function(deckId){
 const c=courseOf(deckId),p=data.profile,pc=c&&pcOfCourse(c);
 if(!c||!pc||!p)return;
 const show=m=>{try{modal('<div class="sh gen-progress" style="text-align:center">'+((typeof animOn==="function"&&animOn())?mascot("think",{size:104,cls:"idle"}):'<div class="genorb"></div>')+'<h2>Building your topic lessons</h2><p class="muted">'+E(m)+'</p><div class="progress"><div style="width:55%"></div></div></div>')}catch(_){}};
 show("Reading your papers…");
 const imgs=await paperImages(pc);
 show(imgs.length?"Studying "+imgs.length+" page"+(imgs.length===1?"":"s")+" from your uploaded papers…":"Planning topics for each term…");
 const lang=LANGS[p.lang]||"English",country=(cOf(p.country)||{}).name||p.country;
 const titles=pc.papers.slice(0,20).map(x=>"Term "+x.term+": "+x.title).join("; ");
 const prompt="You are an expert "+pc.name+" teacher in "+country+" for "+gLabel(cOf(p.country),p.grade)+" learners. Plan a past-paper preparation course. For each of the 4 school terms list 2 or 3 key topics that term tests and exams for this subject and grade usually assess."
  +(imgs.length?" Pages from the student's own past papers are attached: base the topics on what those papers really test, and add the usual topics for the other terms.":"")
  +(titles?" The student's paper titles: "+titles+".":"")
  +" Topic names are at most 6 words, written in "+lang+". Reply with ONLY JSON, no markdown: {\"terms\":[{\"term\":1,\"topics\":[\"...\",\"...\"]},{\"term\":2,\"topics\":[\"...\"]},{\"term\":3,\"topics\":[\"...\"]},{\"term\":4,\"topics\":[\"...\"]}]}";
 try{
  const raw=await gemini(prompt,imgs);
  const obj=jparse(raw),units=[];
  (obj.terms||[]).slice(0,4).forEach((t,i)=>{
   const n=Number(t.term)||i+1;
   (t.topics||[]).slice(0,3).forEach(tp=>{const nm=String(tp||"").trim().slice(0,60);if(nm)units.push({title:"Term "+n+": "+nm,lessons:["Key ideas","Exam-style questions","Past-paper practice"].map(x=>({title:x,qs:[]}))})});
  });
  if(!units.length)throw new Error("The AI reply had no usable topics.");
  c.units=c.units.concat(units);c.topicsBuilt=true;save();closeModal();
  try{toast("Topic lessons added")}catch(_){}
  renderCourse(deckId);
 }catch(err){
  closeModal();
  try{toast(err&&err.message?err.message:"Couldn't build the topic lessons. Try again.")}catch(_){}
 }
};
const _rcPrep=window.renderCourse;
if(typeof _rcPrep==="function")window.renderCourse=function(id){
 _rcPrep.apply(this,arguments);
 try{
  const c=courseOf(id);if(!c||!c.paperPrep||c.topicsBuilt)return;
  const pc=pcOfCourse(c),has=pc&&pc.papers.some(x=>x.fileId);
  const html=`<div style="padding:.2rem 1.1rem .8rem"><button class="btn btn-primary" style="width:100%" onclick="buildPaperTopics('${id}')">✨ Add topic lessons from my papers</button><p class="muted" style="margin:.45rem 0 0;text-align:center">Adds Term 1–4 topic lessons${has?", based on the papers you uploaded":""}. Links can't be read, only uploaded files.</p></div>`;
  const prog=view.querySelector(".cprog");
  if(prog)prog.insertAdjacentHTML("afterend",html);
 }catch(_){}
};

/* ---------- one course per paper (built the same way notes become courses) ---------- */
window.offerPaperCourse=function(cid,pid){
 const pc=(data.paperCourses||[]).find(x=>x.id===cid),p=pc&&pc.papers.find(x=>x.id===pid);if(!p){return}
 const readable=!!p.fileId;
 modal(`<div class="sh" style="text-align:center"><div style="font-size:2.4rem;line-height:1">✅</div><h2>Paper added</h2><p class="muted">Make a course from “${E(p.title)}”? ${readable?"It reads the paper"+(p.memoFileId?" and its memo":"")+" and turns it into lessons":"Links can't be read, so you'd upload the file first. It then turns the paper into lessons"}, the same way your notes become courses.</p><button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="createPaperCourse('${cid}','${pid}')">🎓 Make a course</button><button class="btn btn-secondary" style="width:100%;margin-top:.5rem" onclick="openPaperCourse('${cid}')">Not now</button></div>`);
};
async function transcribePaper(fid,label){
 const rec=await idbGet(fid);
 if(!rec||!rec.blob)throw new Error("That file isn't on this device. Add it again.");
 const file=new File([rec.blob],rec.name||"paper.pdf",{type:rec.type||rec.blob.type||""});
 const imgs=await filesToImages([file]);
 if(!imgs.length)throw new Error("Couldn't read that file.");
 const out=await gemini("Transcribe this "+label+" exactly into plain text. Keep every question number, sub-question, mark allocation and answer. Write tables and data as simple text lines and describe any diagram or graph in square brackets. No commentary, no Markdown.",imgs,{autoFallback:true});
 const t=(typeof cleanAiText==="function"?cleanAiText(out):String(out||"")).trim().slice(0,40000);
 if(t.length<80)throw new Error("Couldn't read enough text from that "+label+". Try a clearer scan.");
 return t;
}
window.attachPaperFile=function(cid,pid){
 const pc=(data.paperCourses||[]).find(x=>x.id===cid),p=pc&&pc.papers.find(x=>x.id===pid);if(!p)return;
 const inp=document.createElement("input");inp.type="file";inp.accept=".pdf,application/pdf,image/*";
 inp.onchange=async()=>{
  const f=inp.files&&inp.files[0];if(!f)return;
  if(f.size>30*1024*1024){try{toast("That file is over 30 MB.")}catch(_){}return}
  try{p.fileId="f"+p.id;p.fileName=f.name;await idbPut(p.fileId,{blob:f,name:f.name,type:f.type});save()}
  catch(_){delete p.fileId;try{toast("Couldn't save that file on this device.")}catch(__){}return}
  createPaperCourse(cid,pid);
 };
 inp.click();
};
window.createPaperCourse=async function(cid,pid){
 const pc=(data.paperCourses||[]).find(x=>x.id===cid),p=pc&&pc.papers.find(x=>x.id===pid);if(!pc||!p)return;
 /* a course already exists: open it (if it never finished, the course page offers to generate it) */
 const have=p.courseDeck&&(data.decks||[]).find(d=>d.id===p.courseDeck);
 if(have){closeModal();go("#/course/"+have.id);return}
 if(!p.fileId){
  modal(`<div class="sh" style="text-align:center"><h2>Upload the paper</h2><p class="muted">“${E(p.title)}” is a link, and the app can't open links. Upload the file (a PDF or photos of the pages) and I'll build the course from it.</p><button class="btn btn-primary" style="width:100%;margin-top:1rem" onclick="attachPaperFile('${cid}','${pid}')">📎 Upload the paper</button><button class="btn btn-secondary" style="width:100%;margin-top:.5rem" onclick="openPaperCourse('${cid}')">Cancel</button></div>`);
  return;
 }
 const show=m=>modal('<div class="sh gen-progress" style="text-align:center">'+((typeof animOn==="function"&&animOn())?mascot("think",{size:104,cls:"idle"}):'<div class="genorb"></div>')+'<h2>Reading your paper</h2><p class="muted">'+E(m)+'</p><div class="progress"><div style="width:35%"></div></div></div>');
 try{
  show("Reading the paper pages…");
  const paperText=await transcribePaper(p.fileId,"exam paper");
  let memoText="";
  if(p.memoFileId){show("Reading the memo…");memoText=await transcribePaper(p.memoFileId,"memo / marking guideline")}
  const d=createDeck(pc.name+": "+p.title);if(!d)throw new Error("Couldn't create the course.");
  d.subject=pc.name;d.paperId=p.id;
  const content="PAST PAPER: "+p.title+" ("+pc.name+", Term "+p.term+"). Each question below tests a skill the student needs to master."+(memoText?" The memo gives the correct answers and mark allocation.":"")+"\n\n"+paperText+(memoText?"\n\nMEMO / MARKING GUIDELINE:\n\n"+memoText:"");
  data.notes.unshift({id:uid(),deckId:d.id,title:p.title,content,createdAt:todayISO()});
  p.courseDeck=d.id;save();
  closeModal();
  await genCourse(d.id);
  try{if(exTab==="papers"&&location.hash.startsWith("#/study"))renderStudy()}catch(_){}
 }catch(err){
  closeModal();
  try{toast(err&&err.message?err.message:"Couldn't build the course. Try again.")}catch(_){}
 }
};

/* ---------- first-run hook: new accounts without a profile get the setup flow ---------- */
const _route=window.route;
if(typeof _route==="function")window.route=function(){
 try{
  if(typeof quickLearnUser!=="undefined"&&quickLearnUser&&typeof qlAccepted!=="undefined"&&qlAccepted&&!data.profile&&!$("ql-onb")){qlStartOnboarding();return}
 }catch(_){}
 return _route.apply(this,arguments);
};
})();
