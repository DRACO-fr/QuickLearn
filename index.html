:root{

  --muted-fg:oklch(0.68 0.014 55);

  --destructive:oklch(0.66 0.19 15);
  --success:oklch(0.72 0.17 150);

  --info:oklch(0.68 0.16 55);

}
*{box-sizing:border-box;border-color:var(--border)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation}
body{margin:0;overflow-x:hidden;width:100%;touch-action:manipulation;overscroll-behavior-x:none;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;margin:0}
button,input,textarea{font-family:inherit}
.shell{max-width:720px;width:100%;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(7rem + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(1rem + env(safe-area-inset-top)) 1.25rem 1rem;background:color-mix(in oklab,var(--background) 85%,transparent);backdrop-filter:blur(12px)}
.brand{font-family:var(--font-display);font-size:1.25rem;font-weight:800;letter-spacing:-.02em;cursor:pointer}
.keybtn{border:1px solid var(--border);background:transparent;color:var(--muted-fg);border-radius:999px;padding:.4rem .9rem;font-size:.75rem;font-weight:600;cursor:pointer}
.keybtn:hover{color:var(--foreground)}
main{padding:0 1.25rem;min-width:0;overflow-x:hidden}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:1rem}
.hero{border-radius:calc(var(--radius) + 8px);padding:1.5rem;background-image:linear-gradient(140deg,oklch(0.4 0.14 55) 0%,oklch(0.28 0.08 55) 55%,oklch(0.22 0.02 55) 100%);margin-top:.5rem}
.hero h1{font-size:1.6rem;font-weight:800}
.hero p{color:oklch(0.85 0.02 55);font-size:.9rem;margin:.4rem 0 0}
.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:0 1rem;font-size:.875rem;font-weight:600;border:none;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-fg);box-shadow:0 12px 32px -14px oklch(0.62 0.21 55 / .85)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-secondary{background:var(--surface-2);color:var(--foreground);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--muted-fg)}
.btn-ghost:hover{color:var(--foreground)}
.btn-success{background:var(--success);color:var(--background)}
.btn-warning{background:var(--warning);color:var(--background)}
.btn-danger{background:var(--destructive);color:var(--primary-fg)}
.input{min-height:44px;width:100%;min-width:0;max-width:100%;border-radius:.75rem;border:1px solid var(--border);background:var(--surface-2);padding:0 .875rem;font-size:16px;color:var(--foreground);outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 30%,transparent)}
.input::placeholder,textarea::placeholder{color:var(--muted-fg)}
textarea.input{font-size:16px;min-height:9rem;padding:.875rem;resize:vertical;line-height:1.6;border-radius:1rem}
.label{margin:1.5rem 0 .75rem;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-fg)}
.empty{border:1px dashed var(--border);border-radius:1rem;background:color-mix(in oklab,var(--surface) 50%,transparent);padding:1.5rem;text-align:center;font-size:.875rem;color:var(--muted-fg)}
.row{display:flex;gap:.5rem;align-items:center;min-width:0}
img,svg{max-width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.muted{color:var(--muted-fg);font-size:.85rem}
.deck-card{display:block;width:100%;max-width:100%;overflow-wrap:anywhere;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;cursor:pointer;color:var(--foreground);margin-bottom:.6rem}
.deck-card:hover{border-color:var(--primary)}
.deck-title{font-weight:700;font-size:.95rem}
.chip{display:inline-block;font-size:.7rem;font-weight:600;border-radius:999px;padding:.15rem .6rem;margin-top:.4rem}
.tone0{color:var(--info);background:oklch(0.68 0.16 55 / .16)}
.tone1{color:var(--warning);background:oklch(0.79 0.15 78 / .16)}
.tone2{color:var(--success);background:oklch(0.72 0.17 150 / .16)}
.tone3{color:var(--primary);background:oklch(0.63 0.19 55 / .18)}
.tone4{color:var(--destructive);background:oklch(0.66 0.19 15 / .16)}
.progress{height:.5rem;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:.8rem}
.progress>div{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;width:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;border-top:1px solid var(--border);background:color-mix(in oklab,var(--surface) 95%,transparent);backdrop-filter:blur(12px);padding:.5rem .5rem max(.5rem,env(safe-area-inset-bottom))}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;background:none;border:none;color:var(--muted-fg);cursor:pointer;padding:.2rem 0;font-size:.625rem;font-weight:700}
.navitem.active{color:var(--primary)}
.navitem .ico{display:flex;height:2rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.75rem}
.navitem.active .ico{background:color-mix(in oklab,var(--primary) 15%,transparent)}
.plusbtn{margin-top:-1.5rem;width:3.25rem;height:3.25rem;border-radius:1rem;background:var(--primary);color:var(--primary-fg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 32px -14px oklch(0.62 0.21 55 / .85)}
.plusbtn:active{transform:scale(.95)}
.modal-bg{position:fixed;inset:0;overflow-y:auto;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);padding:1rem}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{width:100%;max-width:28rem;min-width:0;max-height:min(88dvh,900px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;padding:1.25rem}
.flashcard{position:relative;width:100%;max-width:100%;overflow-wrap:anywhere;min-height:16rem;border-radius:1.5rem;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;transition:.2s;user-select:none}
.flashcard:hover{border-color:var(--primary)}
.flashcard .q{font-size:1.15rem;font-weight:600;line-height:1.5}
.flashcard .hint{position:absolute;bottom:1rem;left:0;right:0;font-size:.7rem;color:var(--muted-fg)}
.flashcard .tag{position:absolute;top:1rem;left:1rem;font-size:.7rem;color:var(--muted-fg)}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:1rem}
.note{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.6rem;font-size:.875rem;line-height:1.6;white-space:pre-wrap}
.md{white-space:normal;overflow-wrap:anywhere}
.md p{margin:0 0 .6rem}
.md h3{font-size:1rem;font-weight:700;margin:.9rem 0 .4rem}
.md h4{font-size:.9rem;font-weight:700;margin:.7rem 0 .3rem}
.md>:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 .6rem;padding-left:1.25rem}
.md li{margin:.2rem 0}
.md strong{font-weight:700;color:var(--foreground)}
.md code{background:var(--surface-2);border-radius:.35rem;padding:.05rem .35rem;font-size:.85em}
.md hr{border:none;border-top:1px solid var(--border);margin:.8rem 0}
.backbtn{background:none;border:none;color:var(--muted-fg);cursor:pointer;font-size:.85rem;font-weight:600;padding:.5rem 0;display:inline-flex;align-items:center;gap:.3rem}
.backbtn:hover{color:var(--foreground)}
.spin{display:inline-block;width:1rem;height:1rem;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.15em}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--foreground);border-radius:.75rem;padding:.6rem 1rem;font-size:.85rem;z-index:60;max-width:90%}
.quiz-opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:.75rem;padding:.8rem 1rem;margin-bottom:.5rem;color:var(--foreground);cursor:pointer;font-size:.9rem}
.quiz-opt.correct{border-color:var(--success);background:color-mix(in oklab,var(--success) 15%,transparent)}
.quiz-opt.wrong{border-color:var(--destructive);background:color-mix(in oklab,var(--destructive) 15%,transparent)}
a.linkcard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.6rem;color:var(--foreground);text-decoration:none}
a.linkcard:hover{border-color:var(--primary)}
/* ===== Knowt-style UI layer ===== */
:root{--background:#130c08;--surface:#261a12;--surface-2:#37261b;--border:#4d3627;--primary:#e29a2d;--primary-fg:#130c08;--font-sans:'DM Sans',system-ui,sans-serif}

.nsep{border:0;border-top:1px solid #4d3627;margin:1.2rem 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;gap:.6rem;padding:.7rem 1rem calc(.8rem + env(safe-area-inset-bottom));background:#000}
.bar .rf{flex:1;display:flex;align-items:center;gap:.6rem;background:#261a12;border:0;color:#8a8a8a;border-radius:999px;padding:.9rem 1.1rem;font-family:DM Sans,system-ui,sans-serif;font-size:.95rem;cursor:pointer;text-align:left}
.bar .brain{display:flex;align-items:center;justify-content:center;gap:.35rem;background:#36251a;color:#fff;border:1px solid #5e4331;border-radius:999px;padding:.85rem .95rem;font-family:DM Sans,system-ui,sans-serif;font-size:1.1rem;cursor:pointer;flex:none}
.bar .ai{display:flex;align-items:center;gap:.5rem;background:#4a2117;color:#fff;border:0;border-radius:999px;padding:.9rem 1.2rem;font-family:DM Sans,system-ui,sans-serif;font-size:.95rem;cursor:pointer}
.bar svg{width:1.15rem;height:1.15rem}
.kh .mid{flex:1;display:flex;justify-content:center}
.kh .pill{border:1px solid #444;border-radius:999px;padding:.5rem 1rem;gap:.45rem;align-items:center}
.pill svg{width:1.1rem!important;height:1.1rem!important}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:.2rem 0 .5rem}
.lc{text-align:left;background:none;border:1px solid #5e4331;border-radius:1.1rem;padding:.9rem;color:#fff;font-family:DM Sans,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;min-height:7.4rem}
.lc .tile{width:2.7rem;height:2.7rem;margin-bottom:.5rem}
.lc b{font-weight:400;font-size:.95rem}.lc small{color:#cfcfcf;font-size:.8rem;line-height:1.3}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;padding:0 1.1rem}
.ext{display:flex;align-items:center;gap:.6rem;background:#261a12;border:0;border-radius:.9rem;padding:.8rem;color:#fff;font-family:DM Sans,system-ui,sans-serif;font-size:.95rem;cursor:pointer;text-align:left;min-width:0}
.ext .e{font-size:1.5rem;flex:none}.ext small{font-size:.8rem}

.ob{display:flex;align-items:center;gap:1rem;width:100%;background:none;border:1px solid #5e4331;border-radius:1rem;padding:.95rem 1rem;color:#fff;font-family:DM Sans,system-ui,sans-serif;font-size:.95rem;margin-bottom:.6rem;cursor:pointer;text-align:left}
.ob svg{width:1.3rem;height:1.3rem;flex:none}.ob:active{background:#37261b}
.sub{text-align:center;color:#ddd;margin:-.6rem 0 1.1rem;font-family:DM Sans,system-ui,sans-serif}
.rec{min-height:8rem;max-height:40vh;overflow:auto;font-family:DM Sans,system-ui,sans-serif;line-height:1.5;color:#ddd}

/* ===== QuickLearn theme layer ===== */
:root{--ql-mint:#e29a2d;--ql-blue:#ff7c5b;--ql-ink:#130d04;--primary:#e29a2d;--primary-fg:#130d04;--font-display:"Sora",system-ui,sans-serif;--font-sans:"DM Sans",system-ui,sans-serif}
body{background:#130c08;background-image:radial-gradient(60rem 30rem at 85% -10%,rgba(226,154,45,.10),transparent 60%),radial-gradient(50rem 30rem at -10% 10%,rgba(255,124,91,.10),transparent 60%);background-attachment:fixed}
.wm{font-family:"Sora",system-ui,sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:-.02em;color:#fff}
.wm b{font-weight:800;color:var(--ql-mint)}
.avatar{color:var(--ql-ink)!important;font-family:"Sora",sans-serif;font-weight:700}
.kh.home{background:linear-gradient(180deg,#261a12 0%,#22100b 100%)}
.sp{background:#130c08!important;border:1px solid #4d3627!important}
.chip2{background:#261a12;border:1px solid #4d3627}
.chip2.on{background:var(--ql-mint);color:var(--ql-ink);border-color:var(--ql-mint);font-weight:600}
.btn-primary,.plusbtn,.fab{background:linear-gradient(135deg,#e29a2d,#d89127)!important;color:var(--ql-ink)!important;box-shadow:0 10px 28px -12px rgba(226,154,45,.7)}
.plusbtn svg,.fab svg{color:var(--ql-ink)}
.row2{border:1px solid #402c1e}
.row2:active{background:#36251a}
.nav-glow,nav.bottom{background:#22100b;border-top:1px solid #402c1e!important}
.modal{background:#261a12;border-top:1px solid #4d3627}
.modal::before{background:#5e4331}
.progress>div{background:linear-gradient(90deg,#e29a2d,#ff7c5b)}
.flashcard{border:1px solid #4d3627;background:linear-gradient(160deg,#331710,#24110c)}
.flashcard:hover{border:1px solid #e29a2d}
.doc h1,.doc .md h3{font-family:"Sora",sans-serif}
.doc .md strong{color:#f5c67f}
.bar{background:#130c08;border-top:1px solid #402c1e}
.bar .ai{background:linear-gradient(135deg,#5e2a1d,#4a1d12);border:1px solid #5e4331}
.ob,.lc{border-color:#5e4331}
.toast{color:var(--ql-ink)}
.quiz-opt{border:1px solid #402c1e}
.empty2 .ec{background:#4a1d12}
.empty2 h3{color:#a78975}

/* ===== course generation delight pack ===== */
.method-card{animation:methodIn .42s cubic-bezier(.2,1.2,.3,1) both;transition:transform .22s,border-color .22s,background .22s}
.method-card:nth-of-type(2){animation-delay:.08s}
.method-card:hover{transform:translateY(-2px);border-color:#e29a2d;background:rgba(226,154,45,.08)}
.course-method{background:linear-gradient(110deg,rgba(226,154,45,.12),rgba(255,124,91,.07));}
.study-tip{margin-top:1rem;padding:1rem;border-radius:1rem;background:linear-gradient(130deg,#30200f,#261a12);border:1px solid #63431e;animation:tipIn .5s .15s both}
.study-tip .tip-spark{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:#e29a2d;color:#130d04;margin-right:.45rem;animation:sparkSpin 5s linear infinite}
.study-tip b{color:#ffc66d}.study-tip p{margin:.55rem 0 0;color:#e5d5c8;font-size:.88rem;line-height:1.5}
.genorb{width:4.2rem;height:4.2rem;margin:.6rem auto 1rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#ffd88a,#e29a2d 45%,#6e3214 80%);box-shadow:0 0 0 8px #e29a2d12,0 0 38px #e29a2d55;animation:orbFloat 2s ease-in-out infinite}
.genorb:after{content:"✦";font-size:2rem;color:#241407;animation:sparkSpin 7s linear infinite}
.gen-tip{margin:.8rem 0 0;padding:.8rem 1rem;border:1px solid #63431e;border-radius:.9rem;background:linear-gradient(100deg,#30200f,#25170f);text-align:left;animation:tipIn .4s both}
.gen-tip b{color:#ffc66d;font-size:.8rem}.gen-tip p{margin:.3rem 0 0;color:#dfcbb8;font-size:.82rem;line-height:1.45}
.unit{animation:unitBloom .5s cubic-bezier(.2,1.1,.3,1) both}
.node{transition:transform .22s cubic-bezier(.2,1.5,.3,1),filter .22s}
.node:not(:disabled):hover{transform:translateY(-3px) scale(1.025);filter:drop-shadow(0 5px 12px #e29a2d30)}
.node.cur{animation:currentPulse 2.4s ease-in-out infinite}
.cprog .progress>div{background-size:200% 100%;animation:progressShine 2s linear infinite}
@keyframes methodIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sparkSpin{to{transform:rotate(360deg)}}
@keyframes orbFloat{0%,100%{transform:translateY(0) rotate(-5deg);filter:saturate(1)}50%{transform:translateY(-7px) rotate(5deg);filter:saturate(1.3)}}
@keyframes unitBloom{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes currentPulse{0%,100%{filter:drop-shadow(0 0 0 #e29a2d00)}50%{filter:drop-shadow(0 0 10px #e29a2d70)}}
@keyframes progressShine{to{background-position:200% 0}}

/* ===== background jobs ===== */
#jobs-root{position:fixed;left:0;right:0;bottom:calc(5.4rem + env(safe-area-inset-bottom));z-index:55;display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:0 1rem;pointer-events:none}
.jobpill{pointer-events:auto;display:flex;align-items:center;gap:.6rem;max-width:min(30rem,100%);background:#261a12;color:#fff;border:1.5px solid #e29a2d;border-radius:999px;padding:.55rem .95rem;font-size:.85rem;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);cursor:pointer;animation:jpin .25s ease}
.jobpill span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobpill.err{border-color:#ff6b9a}
.jobpill.ok{border-color:#e29a2d;background:#372812}
.jobpill .jx{margin-left:.3rem;background:transparent;color:#ff6b9a;border:1px solid #ff6b9a;border-radius:999px;padding:.15rem .6rem;font:inherit;font-size:.78rem;cursor:pointer;flex:none}
.jobpill .x{margin-left:.2rem;opacity:.7;font-size:1rem;line-height:1}
@keyframes jpin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== levels · hard cards · settings · haptics UI ===== */
.kh.home .wm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kh.home .stats{margin-left:0;gap:.8rem}
.stats .lvl{display:flex;align-items:center;gap:.3rem;color:#ffa99c;font-weight:600;cursor:pointer}
.kh .stats .lvl svg{width:1rem;height:1.15rem}
.kh .gear{display:grid;place-items:center;padding:.3rem;border-radius:50%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.kh .gear svg{width:1.4rem;height:1.4rem}
.kh .gear:active{transform:rotate(70deg) scale(.9)}
.shield{position:relative;display:inline-grid;place-items:center;width:var(--sz);height:calc(var(--sz)*1.16);flex:none}
.shield svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 4px 12px rgba(255,114,92,.5))}
.shield b{position:relative;color:#fff;font-family:Sora,sans-serif;font-weight:800;font-size:calc(var(--sz)*.42);margin-top:-2%}

/* level screen */
.lvscreen{--lv-text:#fff;--lv-card:rgba(25,19,15,.72);--lv-sub:#eecdc8;--lv-bar:#3b332d;--lv-go:#000;--lv-go-fg:#fff;margin-bottom:-6.5rem;min-height:100vh;min-height:100dvh;padding-bottom:3rem;background:linear-gradient(180deg,#732a1f 0%,#502115 42%,#2e130c 100%);color:var(--lv-text);font-family:'DM Sans',system-ui,sans-serif}
.lvhd{display:flex;align-items:center;justify-content:space-between;padding:calc(.9rem + env(safe-area-inset-top)) 1.1rem .4rem}
.lvhd h1{font-size:1.15rem;font-weight:400;font-family:'DM Sans',system-ui,sans-serif}
.lvhd button{background:none;border:0;color:var(--lv-text);font-size:1.3rem;width:2.2rem;padding:.3rem 0;cursor:pointer}
.lvh2{font-family:'DM Sans',system-ui,sans-serif;font-weight:400;font-size:1.55rem;line-height:1.25;padding:.6rem 1.1rem 1.1rem;letter-spacing:-.01em}
.lvcard,.lvrow,.lvst{background:var(--lv-card)}
.lvcard{margin:0 1.1rem .8rem;border-radius:1.15rem;padding:1.1rem 1rem;display:flex;align-items:center;gap:1rem}
.lvl-l{flex:1;min-width:0}
.lvname{font-size:1.05rem;color:var(--lv-text,currentColor)}
.lvbar{height:.65rem;border-radius:999px;background:var(--lv-bar,#37261b);margin:.55rem 0 .45rem;overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f07e6c,#ffa99c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lvsub{font-size:.9rem;color:var(--lv-sub,#cfbbae)}
.lvrow{display:flex;align-items:center;gap:1rem;width:calc(100% - 2.2rem);margin:0 1.1rem .65rem;border:0;border-radius:1.15rem;padding:.9rem;color:var(--lv-text);text-align:left;font:inherit;cursor:pointer;transition:transform .15s}
.lvrow:active{transform:scale(.98)}
.lvic{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font-size:1.35rem;flex:none}
.lvt{flex:1;min-width:0;font-size:.98rem;line-height:1.3}
.lvt small{display:block;color:var(--lv-sub);font-size:.82rem;margin-top:.15rem}
.lvgo{width:2rem;height:2rem;border-radius:50%;background:var(--lv-go);color:var(--lv-go-fg);display:grid;place-items:center;flex:none}
.lvstats{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:.9rem 1.1rem .6rem}
.lvst{border-radius:1rem;padding:.85rem .4rem;text-align:center}
.lvst b{display:block;font-family:Sora,sans-serif;font-size:1.3rem}
.lvst small{color:var(--lv-sub);font-size:.75rem}
.lvnote{margin:.4rem 1.4rem 0;color:var(--lv-sub);font-size:.85rem;line-height:1.45;text-align:center}

/* session extras */
.flagbtn{position:absolute;top:.8rem;right:.8rem;display:flex;align-items:center;gap:.3rem;background:rgba(255,255,255,.06);border:1px solid #5e4331;color:#cfbbae;border-radius:999px;padding:.4rem .7rem;font:inherit;font-size:.78rem;cursor:pointer;transition:all .2s}
.flagbtn svg{width:1rem;height:1rem}
.flagbtn.on{background:rgba(255,138,61,.16);border-color:#ff8a3d;color:#ffa45f}
.flagbtn.on svg path{fill:currentColor}
.flagbtn:active{transform:scale(.92)}
.flipanim{animation:flipin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:perspective(900px) rotateY(80deg);opacity:.2}}
.more.flg{color:#a78975}.more.flg svg{width:1.15rem;height:1.15rem}
.more.flg.on{color:#ffa45f}.more.flg.on svg path{fill:currentColor}
.xpfloat{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:90;pointer-events:none;font-family:Sora,sans-serif;font-weight:800;font-size:1.4rem;color:#e29a2d;text-shadow:0 4px 18px rgba(226,154,45,.5);white-space:nowrap;animation:xpup .95s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.sdone{padding:1rem 1.1rem .4rem;text-align:center}
.sdone .sbig{font-size:3.6rem;animation:pop .35s both}
.sdone h2{font-size:1.5rem;margin:.3rem 0 .9rem}
.sumchips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.sumchip{background:#261a12;border:1px solid #4d3627;border-radius:999px;padding:.45rem .85rem;font-size:.9rem}
.sumlv{display:flex;align-items:center;gap:1rem;text-align:left;background:#261a12;border:1px solid #402c1e;border-radius:1.15rem;padding:1rem;margin:1.1rem 0 .6rem}

/* level-up celebration */
.celeb{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#b0402f 0%,#66291a 45%,#26100a 100%);display:flex;align-items:center;justify-content:center;animation:fade .25s both;overflow:hidden;color:#fff}
.celeb-in{position:relative;z-index:2;width:min(22rem,88%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.celeb-k{font-family:Sora,sans-serif;font-weight:800;letter-spacing:.22em;font-size:1rem;color:#ffd3cc;animation:rise .5s .1s both}
.celeb-badge{position:relative;z-index:0;animation:badgein .7s cubic-bezier(.2,1.4,.3,1) both}
.celeb-badge::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(250,154,139,.6),transparent 65%);animation:glow 1.5s ease-in-out infinite alternate;z-index:-1}
.celeb-badge.bump{animation:bump .5s cubic-bezier(.2,1.6,.3,1)}
@keyframes badgein{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes glow{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.celeb-t{font-family:Sora,sans-serif;font-weight:700;font-size:1.6rem;animation:rise .5s .45s both}
.celeb-s{color:#eecdc8;animation:rise .5s .6s both}
.celeb .btn{animation:rise .5s .8s both;margin-top:.6rem}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-24px;border-radius:2px;animation-name:confall;animation-timing-function:cubic-bezier(.3,.6,.5,1);animation-fill-mode:forwards}
@keyframes confall{to{transform:translateY(112vh) rotate(900deg)}}

/* settings sheet */
.setrow{display:flex;align-items:center;gap:.9rem;width:100%;background:none;border:0;color:#fff;font:inherit;text-align:left;padding:.65rem 0;cursor:pointer}
.seti{width:2.9rem;height:2.9rem;border-radius:.8rem;background:#37261b;display:grid;place-items:center;font-size:1.3rem;flex:none}
.sett{flex:1;min-width:0}
.sett b{display:block;font-weight:500}
.sett small{display:block;color:#cfbbae;font-size:.8rem;margin-top:.15rem;line-height:1.3}
.sw{position:relative;width:3.1rem;height:1.8rem;border-radius:999px;background:#5e4331;border:0;flex:none;cursor:pointer;transition:background .2s;padding:0}
.sw i{position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw.on{background:#e29a2d}
.sw.on i{transform:translateX(1.3rem)}
.seg{display:flex;background:#37261b;border-radius:999px;padding:.2rem;margin:.1rem 0 .5rem}
.seg button{flex:1;border:0;background:none;color:#cfbbae;font:inherit;font-size:.9rem;padding:.55rem .75rem;border-radius:999px;cursor:pointer;transition:all .2s;white-space:nowrap}
.seg button.on{background:#e29a2d;color:#130d04;font-weight:600}

/* ===== DAY MODE ===== */
html[data-theme="light"]{color-scheme:light;--background:#fbf5f3;--foreground:#22100b;--surface:#fff;--surface-2:#f8ece9;--border:#ebe0d8;--muted-fg:#826d5f;--accent:#f8e7e3}
html[data-theme="light"] body{background:#fbf5f3;background-image:radial-gradient(60rem 30rem at 85% -10%,rgba(226,154,45,.16),transparent 60%),radial-gradient(50rem 30rem at -10% 10%,rgba(255,124,91,.14),transparent 60%);color:#22100b}
html[data-theme="light"] .wm{color:#22100b}
html[data-theme="light"] .wm b{color:#a6680a}
html[data-theme="light"] .kh.home{background:linear-gradient(180deg,#fff 0%,#fbf1ee 100%)}
html[data-theme="light"] .kh button,html[data-theme="light"] .kh .ib{color:#22100b}
html[data-theme="light"] .stats .lvl{color:#e05b47}
html[data-theme="light"] .stats .lvl svg path{stroke:#e05b47}
html[data-theme="light"] .sp{background:#f8ece9!important;border:1px solid #ebe0d8!important;color:#826d5f}
html[data-theme="light"] .sp input{color:#22100b!important}
html[data-theme="light"] .qa button{color:#22100b}
html[data-theme="light"] .qa i.dv{background:#e1d2c8}
html[data-theme="light"] .qa .c:not([style*="gradient"]){background:#f9e5e0!important}
html[data-theme="light"] .chip2{background:#fff;border:1px solid #ebe0d8;color:#22100b}
html[data-theme="light"] .chip2.on{background:var(--ql-mint);border-color:var(--ql-mint);color:var(--ql-ink)}
html[data-theme="light"] .row2{background:#fff;color:#22100b;border:1px solid #f1e8e2;box-shadow:0 1px 2px rgba(80,32,20,.04)}
html[data-theme="light"] .row2:active{background:#fbf1ee}
html[data-theme="light"] .row2 .t small{color:#826d5f}
html[data-theme="light"] .more{color:#22100b}
html[data-theme="light"] .more.flg{color:#beab9e}
html[data-theme="light"] .more.flg.on{color:#e8741f}
html[data-theme="light"] a.row2,html[data-theme="light"] a.ext{color:#22100b}
html[data-theme="light"] .tile:not([style*="background:none"]){background:#fae8e3!important}
html[data-theme="light"] .viewall{background:#fff;color:#22100b;border-color:#ebe0d8}
html[data-theme="light"] .empty2 .ec{background:#f9e5e0}
html[data-theme="light"] .empty2 h3{color:#947e70}
html[data-theme="light"] .empty2 p{color:#624e41}
html[data-theme="light"] .sk{background:linear-gradient(90deg,#f2eae5 0%,#fbf4f2 50%,#f2eae5 100%) 0 0/200% 100%}
html[data-theme="light"] nav.bottom{background:#fff;border-top:1px solid #eee4dd!important}
html[data-theme="light"] .navitem{color:#22100b}
html[data-theme="light"] .navitem.active{background:color-mix(in oklab,var(--pi) 24%,#fff);color:color-mix(in oklab,var(--pi) 50%,#000)}
html[data-theme="light"] .modal{background:#fff;border-top:1px solid #ebe0d8;color:#22100b}
html[data-theme="light"] .modal::before{background:#e1d2c8}
html[data-theme="light"] .modal-bg{background:rgba(40,16,10,.42)}
html[data-theme="light"] .modal .quiz-opt{background:#fbf1ee}
html[data-theme="light"] .sr{color:#22100b}
html[data-theme="light"] .btn-secondary{background:#f8ece9;color:#22100b}
html[data-theme="light"] .btn-secondary:hover{background:#f5e2dd}
html[data-theme="light"] .btn-ghost{color:#826d5f}
html[data-theme="light"] .btn-danger{background:#fde4e4;color:#c0392b}
html[data-theme="light"] .btn-warning{background:#fdf0d6;color:#a86a00}
html[data-theme="light"] .btn-success{background:#dff5e6;color:#1d8a47}
html[data-theme="light"] .input{background:#fbf1ee;color:#22100b}
html[data-theme="light"] .input:focus{box-shadow:0 0 0 2px rgba(184,118,18,.4)}
html[data-theme="light"] .panel{background:#fff;border-color:#f1e8e2}

/* ===== Study momentum & tactile feedback upgrade ===== */
:root{--ql-orange:#ff9f43;--ql-orange-dark:#d96d19}
.btn,.quiz-opt,.row2,.lc,.ext,.navitem,.chip2,.ob,.flashcard,.plusbtn,.fab{
  transition:transform .32s cubic-bezier(.2,1.45,.35,1),box-shadow .22s ease,background-color .2s ease,border-color .2s ease;
}
.btn,.plusbtn,.fab{position:relative;transform:translateY(0);box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 58%,#271b13),0 7px 16px #0002}
.btn:active,.plusbtn:active,.fab:active{transform:translateY(4px) scale(.98);box-shadow:0 0 0 transparent}
.quiz-opt:active,.row2:active,.lc:active,.ext:active,.ob:active{transform:scale(.965)}

@keyframes nodep{50%{transform:scale(1.06)}}

.lfoot{background:var(--s1);border-top:1px solid var(--bd)}
.fab{position:fixed!important;right:1.2rem;bottom:calc(5.6rem + env(safe-area-inset-bottom))}

/* ===== v5 · warm palette ===== */
:root{--background:#100c09;--foreground:#f7ede2;--surface:#1b1511;--surface-2:#261d17;--primary:#ffb347;--primary-fg:#2a1606;--muted-fg:#b8a594;--accent:#2e231b;--border:#34271f;--ql-mint:#ffb347;--ql-blue:#ff7a59;--ql-orange:#ff8f3d;
 --ob:#100c09;--s1:#1b1511;--s2:#261d17;--bd:#34271f;--mut:#b8a594;--teal:#ffb347;--lime:#ffd166;--coral:#ff7a59}
html[data-theme="light"]{--background:#fbf5ec;--foreground:#2a1d14;--surface:#fffaf3;--surface-2:#f3e9db;--primary:#e8871e;--primary-fg:#fff;--muted-fg:#7a6755;--accent:#f1e4d2;--border:#e6d8c5;
 --ob:#fbf5ec;--s1:#fffaf3;--s2:#f3e9db;--bd:#e6d8c5;--mut:#7a6755;--teal:#e8871e;--lime:#b8860b;--coral:#e0553a}
html[data-theme="light"] body{color:#2a1d14}
.lopt.ok{border-color:#8fd16a;background:#1f2b17;box-shadow:0 4px 0 #8fd16a}
html[data-theme="light"] .lopt.ok{background:#f6efdd}
.lfoot.good{background:#1f2b17}.lfoot.good b{color:#8fd16a}.lfoot.bad{background:#3a1a14}
html[data-theme="light"] .lfoot.good{background:#f6efdd}html[data-theme="light"] .lfoot.good b{color:#3d8a1f}

/* no fade-from-grey on lists or page changes */
.row2,.rows>*{animation:none;opacity:1!important}
@keyframes inR{from{transform:translateX(40%)}}
@keyframes inL{from{transform:translateX(-40%)}}

/* ===== v6 · motion system + themed dialogs ===== */
:root{--err:#ff6b6b;--ok:#8fd16a;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1)}
html[data-theme="light"]{--err:#d8383d;--ok:#3d8a1f}
html{color-scheme:dark}html[data-theme="light"]{color-scheme:light}
input[type=checkbox],input[type=radio]{accent-color:var(--teal)}
::selection{background:color-mix(in oklab,var(--teal) 40%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetOut{to{transform:translateY(105%)}}
@keyframes rowIn{from{transform:translateY(12px)}}
@keyframes tabInR{from{transform:translateX(28px) scale(.985)}}
@keyframes tabInL{from{transform:translateX(-28px) scale(.985)}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.94)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.96)}}
@keyframes errShake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes errIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes jpOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes navPop{from{transform:scale(.85)}}
@keyframes icoHop{40%{transform:translateY(-4px) scale(1.15)}}
@keyframes celebOut{to{opacity:0;transform:scale(1.05)}}
@keyframes dialogIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes dialogOut{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* tabs + pages */
#view.tabR{animation:tabInR .32s var(--ease) backwards}
#view.tabL{animation:tabInL .32s var(--ease) backwards}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard,.empty2){animation:rowIn .42s var(--ease) both}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(2){animation-delay:.04s}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(3){animation-delay:.08s}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(4){animation-delay:.12s}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(5){animation-delay:.16s}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(6){animation-delay:.2s}
#view.enter :is(.row2,.xcard,.lvrow,.ext,.lc,.xm,.sp2,.panel,.deck-card,.sumchip,.lvcard):nth-child(n+7){animation-delay:.24s}
.navitem.active{animation:navPop .35s var(--spring) both}
.navitem.active .ico{display:inline-block;animation:icoHop .45s var(--spring) both}

/* sheets + dialogs: open / close */
.modal-bg.swap{animation:none}
.modal-bg.closing{animation:fadeOut .24s ease both;pointer-events:none}
.modal-bg.closing .modal{animation:sheetOut .26s cubic-bezier(.4,0,1,1) both}
.modal-bg.dlg{align-items:center;padding:1rem}
.modal-bg.dlg .modal{border-radius:1.6rem;max-width:26rem;border:1px solid var(--bd);animation:dialogIn .3s var(--spring) both}
.modal-bg.dlg .modal::before{display:none}
.modal-bg.dlg.closing .modal{animation:dialogOut .2s ease-in both}
.dlg .dlg-ic{display:grid;place-items:center;width:3rem;height:3rem;margin:.4rem auto .7rem;border-radius:50%;font-size:1.3rem;background:color-mix(in oklab,var(--teal) 18%,transparent)}
.dlg.danger .dlg-ic{background:color-mix(in oklab,var(--err) 20%,transparent);color:var(--err)}
.dlg h2{margin-bottom:.4rem!important}
.dlg p{margin:0 0 1.2rem;text-align:center;color:var(--mut);line-height:1.5;font-size:.92rem}
.dlg .dlg-btns{display:flex;gap:.6rem}.dlg .dlg-btns .btn{flex:1}
.celeb.closing{animation:celebOut .26s ease both;pointer-events:none}
.modal .sh>:is(.sr,.setrow,.ob){animation:rowIn .36s var(--ease) both}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(3){animation-delay:.03s}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(4){animation-delay:.06s}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(5){animation-delay:.09s}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(6){animation-delay:.12s}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(7){animation-delay:.15s}
.modal .sh>:is(.sr,.setrow,.ob):nth-child(n+8){animation-delay:.18s}
.modal-bg.closing .sh>*{animation:none}

/* toasts: stacked, typed, animated */
#toast-root{position:fixed;top:calc(.8rem + env(safe-area-inset-top));left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:0 1rem;pointer-events:none}
#toast-root .toast{position:relative;top:auto;left:auto;bottom:auto;transform:none;max-width:min(100%,28rem);display:flex;align-items:center;gap:.6rem;pointer-events:auto;cursor:pointer;border-radius:1.4rem;line-height:1.35;text-align:left;animation:toastIn .34s var(--spring) both;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
#toast-root .toast.closing{animation:toastOut .22s ease-in both}
#toast-root .toast .ti{flex:none;display:grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;font-size:.78rem;font-weight:800;line-height:1}
#toast-root .toast:is(.error,.success,.warn){background:var(--s1);color:var(--foreground);border-width:1.5px}
#toast-root .toast.error{border-color:var(--err);animation:toastIn .34s var(--spring) both,errShake .45s .3s}
#toast-root .toast.error .ti{background:var(--err);color:#2a0508}
#toast-root .toast.success{border-color:var(--ok)}
#toast-root .toast.success .ti{background:var(--ok);color:#12230a}
#toast-root .toast.warn{border-color:var(--teal)}
#toast-root .toast.warn .ti{background:var(--teal);color:#130d04}
#toast-root .toast.error.closing{animation:toastOut .22s ease-in both}

/* inline errors */
.errbox{display:flex;gap:.7rem;align-items:flex-start;margin-top:.75rem;padding:.8rem .9rem;border-radius:1.15rem;background:var(--s1);border:1px solid color-mix(in oklab,var(--err) 55%,var(--bd));box-shadow:inset 3px 0 0 var(--err);font-size:.85rem;line-height:1.45;color:var(--foreground);text-align:left;animation:errIn .3s var(--ease) both,errShake .45s .25s}
.errbox .ei{flex:none;display:grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:color-mix(in oklab,var(--err) 22%,transparent);color:var(--err);font-size:.85rem;font-weight:800}
.errbox .em{min-width:0;overflow-wrap:anywhere}.errbox .muted{display:block;margin-top:.25rem}
.jobpill.err{border-color:var(--err)}.jobpill .jx,.jobpill.err .t{color:var(--err)}.jobpill .jx{border-color:var(--err)}
.jobpill{animation:none}.jobpill.in{animation:jpin .3s var(--spring) both}.jobpill.out{animation:jpOut .22s ease both;pointer-events:none}

/* folder picker */
.fpick{margin-top:.75rem}
.fp-trigger{display:flex;align-items:center;gap:.7rem;width:100%;min-height:48px;padding:.4rem .9rem .4rem .6rem;border:1px solid var(--bd);border-radius:1rem;background:var(--s2);color:var(--foreground);font:inherit;font-size:1rem;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .15s}
.fp-trigger:active{transform:scale(.99)}
.fpick.open .fp-trigger{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in oklab,var(--teal) 25%,transparent)}
.fp-ic{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.6rem;background:var(--s1);flex:none}
.fp-ic svg{width:1.25rem;height:1.25rem}
.fp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-chev{flex:none;opacity:.6;font-size:1.3rem;line-height:1;transform:rotate(90deg);transition:transform .3s var(--spring)}
.fpick.open .fp-chev{transform:rotate(-90deg)}
.fp-list{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s var(--ease),visibility 0s .3s}
.fpick.open .fp-list{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.fp-in{overflow:hidden;min-height:0}
.fp-scroll{max-height:13.5rem;overflow-y:auto;margin-top:.5rem;padding:.35rem;border:1px solid var(--bd);border-radius:1rem;background:var(--s1)}
.fp-opt{display:flex;align-items:center;gap:.7rem;width:100%;padding:.45rem .55rem;border:0;border-radius:.8rem;background:none;color:var(--foreground);font:inherit;text-align:left;cursor:pointer;transition:background .15s}
.fp-opt .fp-ic{background:var(--s2)}
.fp-opt:hover,.fp-opt:active{background:var(--s2)}.fp-opt:hover .fp-ic,.fp-opt:active .fp-ic,.fp-opt.sel .fp-ic{background:var(--s1)}
.fp-opt.sel{background:color-mix(in oklab,var(--teal) 16%,transparent)}
.fp-opt .ck{margin-left:auto;color:var(--teal);font-weight:800;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.fp-opt.sel .ck{opacity:1;transform:none}
.fpick.open .fp-opt{animation:rowIn .32s var(--ease) both}
.fpick.open .fp-opt:nth-child(2){animation-delay:.04s}.fpick.open .fp-opt:nth-child(3){animation-delay:.08s}.fpick.open .fp-opt:nth-child(4){animation-delay:.12s}.fpick.open .fp-opt:nth-child(n+5){animation-delay:.16s}
select.input{appearance:none;-webkit-appearance:none;padding-right:2.2rem;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 1.2rem) 50%,calc(100% - .9rem) 50%;background-size:.35rem .35rem;background-repeat:no-repeat}

/* reduce motion (setting, defaults to the device preference) */
html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
html[data-motion="reduced"] :is(.spin,.genorb){animation-duration:1.6s!important;animation-iteration-count:infinite!important}
html[data-motion="reduced"] .confetti{display:none}

/* no tap highlight, no accidental UI selection (text stays selectable in inputs and note content) */
*{-webkit-tap-highlight-color:transparent}
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable],.doc,.doc *,.md,.md *,.rec,.rec *,.errbox .em{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
:focus:not(:focus-visible){outline:none}
img,svg{-webkit-user-drag:none}

.modal.hasgrab::before{display:none}
.grab{position:relative;height:2.2rem;margin:-.7rem -1.2rem -.2rem;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:50%;top:.7rem;width:2.4rem;height:.28rem;margin-left:-1.2rem;border-radius:9px;background:color-mix(in oklab,var(--mut) 55%,transparent);transition:width .2s,margin .2s}
.grab:active::after{width:3rem;margin-left:-1.5rem}
/* ===== mascot pack: mascot · combo · results flow · chest · coins ===== */
.mxw{display:inline-block;width:var(--s,120px);height:var(--s,120px);flex:none;position:relative;line-height:0}
.mxw svg{width:100%;height:100%;overflow:visible;display:block}
.mxw.idle{animation:mxBob 3s ease-in-out infinite}
.mxw.hop{animation:mxHop .7s cubic-bezier(.2,1.4,.35,1) both}
.mxw.shake{animation:mxShake .55s both}
.mxw.cheer{animation:mxCheer .85s ease-in-out infinite}
.mxw.pop{animation:mxPop .7s cubic-bezier(.2,1.5,.3,1) both}
@keyframes mxBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(1.015,.985)}}
@keyframes mxHop{0%{transform:translateY(0) scale(1.1,.88)}35%{transform:translateY(-22%) scale(.94,1.08)}65%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes mxShake{0%,100%{transform:none}20%{transform:translateX(-7%) rotate(-4deg)}40%{transform:translateX(6%) rotate(3deg)}60%{transform:translateX(-4%)}80%{transform:translateX(3%)}}
@keyframes mxCheer{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-12%) scale(.97,1.03)}}
@keyframes mxPop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.mx-eyes{transform-box:fill-box;transform-origin:center;animation:mxBlink 4.4s infinite}
@keyframes mxBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mx-armL,.mx-armR{transform-box:fill-box;transform-origin:50% 100%}
.mx-armL{animation:mxArmL .42s ease-in-out infinite alternate}
.mx-armR{animation:mxArmR .42s ease-in-out infinite alternate}
.mx-wave{transform-box:fill-box;transform-origin:50% 100%;animation:mxWave .5s ease-in-out infinite alternate}
@keyframes mxArmL{from{transform:rotate(-10deg)}to{transform:rotate(8deg)}}
@keyframes mxArmR{from{transform:rotate(10deg)}to{transform:rotate(-8deg)}}
@keyframes mxWave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.mx-heart{transform-box:fill-box;transform-origin:center;animation:mxHeart 1.8s ease-out infinite}
@keyframes mxHeart{0%{opacity:0;transform:translateY(10px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.05)}}
.mx-sp{transform-box:fill-box;transform-origin:center;animation:mxTwinkle 1.1s ease-in-out infinite alternate}
@keyframes mxTwinkle{from{opacity:.25;transform:scale(.5) rotate(0)}to{opacity:1;transform:scale(1.1) rotate(25deg)}}
.mx-tear{animation:mxTear 1.7s ease-in infinite}
@keyframes mxTear{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.mx-z{animation:mxZ 2.6s ease-in-out infinite}
@keyframes mxZ{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
html[data-mx="off"] .mxw,html[data-mx="off"] .mxw *,html[data-mx="off"] .cbig,html[data-mx="off"] .hearts,html[data-mx="off"] .celeb.mxc *,html[data-mx="off"] .mxsticker{animation:none!important}
html[data-mx="off"] .celeb.mxc .confetti{display:none}

/* lesson: mascot + speech bubble */
.mxrow{display:flex;align-items:flex-end;gap:.7rem;padding:.3rem 1.3rem 0;position:relative}
.mxbubble{position:relative;background:var(--s1);border:2px solid var(--bd);border-radius:1rem;padding:.55rem .9rem;font-weight:600;font-size:.95rem;margin-bottom:1.2rem;max-width:72%}
.mxbubble::before{content:"";position:absolute;left:-.5rem;bottom:.95rem;width:.8rem;height:.8rem;background:inherit;border-left:2px solid;border-bottom:2px solid;border-color:inherit;transform:rotate(45deg)}
.mxbubble.good{border-color:#8fd16a}.mxbubble.bad{border-color:#ff7a6b}
.mxsticker{position:absolute;left:6.4rem;top:-.55rem;transform:rotate(-8deg);font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:#fff;-webkit-text-stroke:6px #1ea4bd;paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:mxStick 1.9s cubic-bezier(.2,1.5,.3,1) both}
@keyframes mxStick{0%{transform:rotate(-8deg) scale(0)}14%{transform:rotate(-8deg) scale(1.25)}24%{transform:rotate(-8deg) scale(1)}84%{opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:0}}
.lp>div{transition:width .55s cubic-bezier(.2,.9,.3,1);position:relative}
.lp>div::after{content:"";position:absolute;left:.45rem;right:.45rem;top:.14rem;height:.16rem;border-radius:9px;background:rgba(255,255,255,.4)}
.hearts.lost{animation:mxHeartLost .6s both}
@keyframes mxHeartLost{0%{transform:none}30%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(.85)}100%{transform:none}}

/* course path */
.mxnode{position:absolute;top:.5rem;display:block;font-style:normal;pointer-events:none}
.mxnode.l{right:calc(100% - .5rem)}.mxnode.r{left:calc(100% - .5rem)}
.coinchip svg{width:1.15rem;height:1.15rem}
.kh .stats>.coinchip{gap:.35rem}

/* full-screen reward flow */
.mxo{position:fixed;inset:0;z-index:110;background:var(--ob);color:var(--foreground);display:flex;flex-direction:column;animation:fade .25s both;overflow:hidden}
.mxo .confetti{z-index:1}
.mxo-in{position:relative;z-index:2;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(1.5rem + env(safe-area-inset-top)) 1.5rem 1rem;gap:.8rem;animation:mxIn .45s cubic-bezier(.2,1,.3,1) both}
@keyframes mxIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mxo-foot{position:relative;z-index:3;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));width:100%;max-width:720px;margin:0 auto}
.mxo-foot .btn{width:100%}
.mxo-foot .btn:disabled{opacity:.45}
.mxo-h{font-family:var(--font-display);font-weight:800;font-size:1.75rem;line-height:1.15;color:var(--teal)}
.mxo-p{color:var(--mut);line-height:1.45;max-width:20rem;margin:0}
.mxpill{display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--c,#3cbbca);color:var(--c,#3cbbca);border-radius:999px;padding:.35rem .9rem;font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.mxst{display:flex;gap:.6rem;width:100%;max-width:22rem;margin-top:.5rem}
.mxst>div{flex:1;border:2px solid var(--c);border-radius:1rem;overflow:hidden;background:var(--s1);animation:mxIn .5s both}
.mxst>div:nth-child(1){--c:#e29a2d;animation-delay:.25s}.mxst>div:nth-child(2){--c:#3cbbca;animation-delay:.4s}.mxst>div:nth-child(3){--c:#8fd16a;animation-delay:.55s}
.mxst small{display:block;background:var(--c);color:#130d04;font-weight:800;font-size:.74rem;padding:.3rem 0}
.mxst b{display:block;padding:.75rem 0;font-family:var(--font-display);font-size:1.25rem;color:var(--c)}
.mxbar{width:100%;max-width:22rem;height:1.15rem;border-radius:999px;background:var(--s2);overflow:hidden;margin-top:.4rem}
.mxbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#e29a2d,#ffd166);transition:width 1.2s cubic-bezier(.2,.9,.3,1);position:relative}
.mxbar i::after{content:"";position:absolute;left:.5rem;right:.5rem;top:.18rem;height:.2rem;border-radius:9px;background:rgba(255,255,255,.45)}
.mxbarlbl{display:flex;justify-content:space-between;width:100%;max-width:22rem;font-family:var(--font-display);font-weight:800;color:var(--mut)}
.mxflame{font-size:5.5rem;line-height:1;animation:mxFlicker 1.1s ease-in-out infinite;filter:drop-shadow(0 0 24px #ff7a2b88)}
@keyframes mxFlicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.mxbig{font-family:var(--font-display);font-weight:800;font-size:5rem;line-height:1;color:#ff8a3d}
.mxweek{display:flex;gap:.5rem;margin-top:.6rem}
.mxday{display:grid;gap:.3rem;justify-items:center;color:var(--mut);font-size:.72rem;font-weight:700}
.mxday span{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:800;color:#130d04;font-size:1rem}
.mxday.on span{background:#ff8a3d}
.mxday.today span{animation:mxPop .6s .5s cubic-bezier(.2,1.6,.3,1) both}

<script>
/* ============================== FIREBASE AUTH ============================== */
const firebaseConfig = {

  authDomain: "quicklearn-14967.firebaseapp.com",
  projectId: "quicklearn-14967",

  appId: "1:1032448337480:web:03d5a84f2458beae141a7d",
  measurementId: "G-LPGWD5E0LS"
};
let quickLearnAuth = null;
let quickLearnUser = null;
try {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  quickLearnAuth = firebase.auth();
  quickLearnAuth.onAuthStateChanged(user => {
    quickLearnUser = user || null;
    const btn = document.getElementById('accountBtn');
    if (btn) btn.textContent = user ? (user.displayName ? user.displayName.split(' ')[0] : 'Account') : 'Sign in';
    if (user) { try { toast('Signed in as ' + (user.email || user.displayName || 'QuickLearn user')); } catch (_) {} }
  });
} catch (e) { console.error('Firebase initialization failed:', e); }
function qlEscapeHtml(value){ return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch])); }
function openAccountModal() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const user = quickLearnUser;
  root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeAccountModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="qlAuthTitle">
    <button class="modal-close" onclick="closeAccountModal()" aria-label="Close">×</button>
    <h2 id="qlAuthTitle">${user ? 'Your QuickLearn account' : 'Sign in to QuickLearn'}</h2>
    ${user ? `<p class="muted">Signed in as <strong>${qlEscapeHtml(user.email || user.displayName || 'Google account')}</strong></p><button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="quickLearnSignOut()">Sign out</button>` : `
      <p class="muted">Sign in to use your QuickLearn account. Cloud syncing will be enabled after the database rules are configured.</p>
      <label class="field-label" for="qlAuthEmail">Email</label><input class="input" id="qlAuthEmail" type="email" autocomplete="email" placeholder="you@example.com">
      <label class="field-label" for="qlAuthPassword">Password</label><input class="input" id="qlAuthPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <div id="qlAuthError" role="alert" style="color:var(--danger,#ff6b6b);font-size:.9rem;margin-top:8px"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="quickLearnEmailSignIn()">Sign in with email</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="quickLearnEmailSignUp()">Create account</button>
      <button class="btn" style="width:100%;margin-top:8px" onclick="quickLearnGoogleSignIn()">Continue with Google</button>`}
  </section></div>`;
}
function closeAccountModal(){ const root=document.getElementById('modal-root'); if(root) root.innerHTML=''; }
function qlAuthError(message){ const el=document.getElementById('qlAuthError'); if(el) el.textContent=message; else toast(message); }
function qlAuthFields(){ return {email:(document.getElementById('qlAuthEmail')?.value||'').trim(),password:document.getElementById('qlAuthPassword')?.value||''}; }
async function quickLearnEmailSignIn(){
  if(!quickLearnAuth) return qlAuthError('Firebase could not initialize. Check your internet connection and Firebase configuration.');
  const {email,password}=qlAuthFields(); if(!email||!password) return qlAuthError('Enter your email and password.');
  try { await quickLearnAuth.signInWithEmailAndPassword(email,password); closeAccountModal(); toast('Welcome back!'); }
  catch(e){ qlAuthError(qlAuthMessage(e)); }
}
async function quickLearnEmailSignUp(){
  if(!quickLearnAuth) return qlAuthError('Firebase could not initialize. Check your internet connection and Firebase configuration.');
  const {email,password}=qlAuthFields(); if(!email||!password) return qlAuthError('Enter your email and choose a password.');
  if(password.length<6) return qlAuthError('Use a password with at least 6 characters.');
  try { await quickLearnAuth.createUserWithEmailAndPassword(email,password); closeAccountModal(); toast('QuickLearn account created!'); }
  catch(e){ qlAuthError(qlAuthMessage(e)); }
}
async function quickLearnGoogleSignIn(){
  if(!quickLearnAuth) return qlAuthError('Firebase could not initialize. Check your internet connection and Firebase configuration.');
  try { const provider=new firebase.auth.GoogleAuthProvider(); await quickLearnAuth.signInWithPopup(provider); closeAccountModal(); toast('Signed in with Google!'); }
  catch(e){
    // Mobile browsers often block popups; redirect is the fallback.
    if(e && (e.code==='auth/popup-blocked' || e.code==='auth/popup-closed-by-user' || e.code==='auth/operation-not-supported-in-this-environment')) {
      try { await quickLearnAuth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); return; } catch(err) { qlAuthError(qlAuthMessage(err)); return; }
    }
    qlAuthError(qlAuthMessage(e));
  }
}
async function quickLearnSignOut(){ try { await quickLearnAuth.signOut(); closeAccountModal(); toast('Signed out'); } catch(e){ toast(qlAuthMessage(e)); } }
function qlAuthMessage(e){ const code=e&&e.code; const map={
  'auth/email-already-in-use':'That email already has an account. Try signing in.',
  'auth/invalid-email':'That email address does not look valid.',
  'auth/weak-password':'Choose a stronger password (at least 6 characters).',
  'auth/user-not-found':'No account found for that email. Create an account first.',
  'auth/wrong-password':'Incorrect password. Try again.',
  'auth/invalid-credential':'Email or password is incorrect. Check them and try again.',
  'auth/popup-closed-by-user':'Google sign-in was closed before it finished.',
  'auth/unauthorized-domain':'This website domain is not authorized in Firebase Authentication settings.'
}; return map[code] || (e&&e.message) || 'Sign-in failed. Please try again.'; }

const EMPTY = { decks: [], subjects: [], notes: [], cards: [], examSchedule: {}, subjectScores: {}, studyFreq: {}, game: { level:1, xp:0, day:"", base:0, conquered:0, coins:0 }, mascot: { name:"", asked:0, worn:{} } };
let data = load();

function load(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(!raw) return structuredClone(EMPTY);
    const d = JSON.parse(raw);
    // Migrate old format (one date string per subject) to a list of exams per subject.
    const sched = {};
    Object.entries(d.examSchedule||{}).forEach(([sid,v])=>{
      if(Array.isArray(v)) sched[sid] = v.filter(e=>e && e.date);
      else if(typeof v === "string" && v) sched[sid] = [{ id:Math.random().toString(36).slice(2,10), date:v, title:"" }];
    });
    return {
      decks:d.decks||[], subjects:d.subjects||[], notes:d.notes||[], cards:d.cards||[],
      examSchedule:sched, subjectScores:d.subjectScores||{}, studyFreq:d.studyFreq||{},
      game:Object.assign({ level:1, xp:0, day:"", base:0, conquered:0, coins:0 }, d.game||{}),
      reviewLog:d.reviewLog||{}, courses:d.courses||{}, profile:d.profile||null, paperCourses:d.paperCourses||[],
      mascot:Object.assign({ name:"", asked:0, worn:{} }, d.mascot||{})
    };
  }catch{ return structuredClone(EMPTY); }
}
function save(){ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function localISODate(){
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dayDiff(a,b){
  if(!a||!b)return 999;
  const [ay,am,ad]=a.split("-").map(Number),[by,bm,bd]=b.split("-").map(Number);
  return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000);
}
function practiceStreak(){
  const g=data.game||(data.game={});
  const today=localISODate(), last=g.lastPracticeDate||"";
  if(last===today)return Math.max(1,g.streak||1);
  if(dayDiff(last,today)===1)return Math.max(1,g.streak||0)+1;
  return 1;
}
function markPractice(){
  const g=data.game||(data.game={});
  const today=localISODate();
  if(g.lastPracticeDate===today)return;
  g.streak=dayDiff(g.lastPracticeDate,today)===1?(g.streak||0)+1:1;
  g.lastPracticeDate=today; save();
}
function streakBadge(){
  const g=data.game||{},today=localISODate(),last=g.lastPracticeDate||"";
  const n=last===today||dayDiff(last,today)===1?(g.streak||0):0;
  return `<button class="streak-pill" title="Consecutive practice days" onclick="toast('${n?`${n} day${n===1?"":"s"} in a row — keep it going!`:"Start your streak today!"}')" aria-label="${n} day practice streak"><span class="flame">🔥</span><span>${n}</span></button>`;
}

const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(d,n){ const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayISO()+"T00:00:00");
  const target = new Date(dateStr+"T00:00:00");
  return Math.round((target-today)/86400000);
}
// ---- exams: each subject can have several (e.g. Math Paper 1 and Paper 2) ----
const examsOf = sid => (data.examSchedule[sid] || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
const upcomingExams = sid => examsOf(sid).filter(e => daysUntil(e.date) >= 0);
// Days until the soonest not-yet-passed exam of a subject, or null if none.
function nextExamDays(sid){
  const u = upcomingExams(sid);
  return u.length ? daysUntil(u[0].date) : null;
}
function addExam(sid, date, title){
  if(!sid || !date) return false;
  data.examSchedule[sid] = data.examSchedule[sid] || [];
  if(data.examSchedule[sid].some(e => e.date === date && (e.title||"").toLowerCase() === (title||"").toLowerCase())) return false;
  data.examSchedule[sid].push({ id:uid(), date, title:(title||"").trim() });
  return true;
}
function fmtDate(d){
  try{ return new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); }
  catch{ return d; }
}
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const deckCards = id => data.cards.filter(c => c.deckId === id);
const deckNotes = id => data.notes.filter(n => n.deckId === id);
// A card is "hard" when you flagged it yourself, or when you keep missing it (see rateCard).
const isHard = c => !!(c.manualHard || c.autoHard);
const hardScore = c => (c.manualHard ? 50 : 0) + (c.autoHard ? 20 : 0) + (c.struggle || 0) * 8;
const hardCards = id => data.cards.filter(c => isHard(c) && (id ? c.deckId === id : true)).sort((a,b) => hardScore(b) - hardScore(a));
// Due cards, hardest first — so the cards you struggle with are always at the front of the queue.
const dueCards = id => data.cards.filter(c => (!c.nextReview || c.nextReview <= todayISO()) && (id ? c.deckId === id : true)).sort((a,b) => hardScore(b) - hardScore(a));
const subjectName = d => d.subjectId ? (data.subjects.find(s=>s.id===d.subjectId)?.name || d.subject) : d.subject;
const tone = i => "tone" + (i % 5);

function createDeck(title, subjectId){
  if(!title.trim()) return null;
  const subj = data.subjects.find(s=>s.id===subjectId);
  const deck = { id:uid(), title:title.trim(), subject: subj?subj.name:"General", subjectId: subjectId||null, createdAt: todayISO() };
  data.decks.unshift(deck); save(); return deck;
}
function deleteDeck(id){
  data.decks = data.decks.filter(d=>d.id!==id);
  data.notes = data.notes.filter(n=>n.deckId!==id);
  data.cards = data.cards.filter(c=>c.deckId!==id);
  save();
}
function createSubject(name){
  if(!name.trim()) return;
  data.subjects.push({ id:uid(), name:name.trim(), createdAt: todayISO() }); save();
}
function deleteSubject(id){
  data.subjects = data.subjects.filter(s=>s.id!==id);
  data.decks = data.decks.map(d => d.subjectId===id ? {...d, subjectId:null} : d);
  save();
}
function addCards(deckId, cards){
  const made = cards.filter(c=>c.question?.trim() && c.answer?.trim()).map(c=>({
    id:uid(), deckId, question:c.question.trim(), answer:c.answer.trim(),
    interval:1, ease:2.3, repetitions:0, nextReview: todayISO()
  }));
  if(made.length){ data.cards = [...made, ...data.cards]; save(); }
  return made.length;
}
/* Spaced repetition + "struggle" tracking.
   Every card carries a struggle score: Again +2, Hard +1, Good -1, Easy -2.
   At 3+ it becomes an auto-hard card (cleared again once the score falls to 1 or less).
   Hard cards (auto or flagged by you) get short intervals, so they come due the most. */
function rateCard(cardId, rating){
  const out = { wasHard:false, nowHard:false };
  data.cards = data.cards.map(c=>{
    if(c.id!==cardId) return c;
    out.wasHard = isHard(c);
    let {interval, ease, repetitions} = c;
    let struggle = c.struggle||0, lapses = c.lapses||0, hardCount = c.hardCount||0, autoHard = !!c.autoHard;
    let manualHard = !!c.manualHard, hardStreak = c.hardStreak||0;
    let nextIn;
    if(rating==="again"){ repetitions=0; interval=1; ease=Math.max(1.3, ease-0.2); lapses++; struggle+=2; hardStreak=0; nextIn=0; }   // missed = still due today
    else{
      repetitions++;
      if(rating==="hard"){ interval=Math.max(1, Math.round(interval*1.2)); ease=Math.max(1.3, ease-0.05); hardCount++; struggle+=1; manualHard=true; hardStreak=0; }
      else if(rating==="good"){ interval=Math.round(interval*ease); struggle=Math.max(0, struggle-1); if(manualHard) hardStreak++; }
      else { interval=Math.round(interval*ease*1.3); ease=ease+0.1; struggle=Math.max(0, struggle-2); if(manualHard) hardStreak++; }
      nextIn = interval;
    }
    // A Hard rating immediately adds the card to “Hard now”. Two successful
    // reviews in a row clear that flag; repeated misses can still keep it hard.
    if(manualHard && hardStreak>=2) { manualHard=false; hardStreak=0; }
    if(struggle>=3) autoHard = true; else if(struggle<=1) autoHard = false;
    const next = { ...c, interval, ease, repetitions, struggle, lapses, hardCount, autoHard, manualHard, hardStreak };
    if(isHard(next)){                                   // hard cards never drift far away
      const cap = next.manualHard ? 3 : 2;
      if(nextIn>cap) nextIn = cap;
      if(next.interval>cap*2) next.interval = cap*2;
    }
    next.nextReview = addDays(todayISO(), nextIn);
    out.nowHard = isHard(next);
    return next;
  });
  save();
  return out;
}
function toggleHard(id){
  const c = data.cards.find(x=>x.id===id); if(!c) return;
  c.manualHard = !c.manualHard;
  save();
  haptic(c.manualHard ? "hard" : "select");

}

// Haptic vocabulary. Patterns are [buzz, pause, buzz, …] in ms. Short, crisp pulses with tiny gaps feel like a *tap*
// rather than a buzz: rising pulses = success, a firm double-thud = a miss, a long crescendo = level up.
const HAP = {
  // Short, tactile patterns: tiny UI ticks, a soft flip double-tap,
  // rising positive feedback, and a distinct heavier miss pattern.
  tap:[8], select:[12], flip:[10,24,8],
  good:[14,28,24], easy:[10,24,14,24,20,30,34],
  hard:[30,42,16], again:[58,36,72,34,42],
  buildup:[9,28,12,26,15,24,19,22,24,20,30,18],
  levelhit:[42,28,105,42,145], sparkle:[10,38,10,38,12,38,18],
  complete:[16,35,16,35,46]
};
let _iosSwitch = null;
function iosTick(){   // iPhone Safari has no Vibration API; on iOS 17.4+ toggling a hidden switch gives a light tick
  try{
    if(!_iosSwitch){
      const l = document.createElement("label");
      l.setAttribute("aria-hidden","true");
      l.style.cssText = "position:fixed;left:-200px;top:-200px;width:1px;height:1px;opacity:0;pointer-events:none";
      const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch","");
      l.appendChild(i); document.body.appendChild(l); _iosSwitch = l;
    }
    _iosSwitch.click();
  }catch(_){}
}
function haptic(name){
  if(!settings.haptics) return;
  const p = HAP[name]; if(!p) return;
  try{
    if(navigator.vibrate){
      // Cancel a lingering pattern before starting the next crisp interaction.
      navigator.vibrate(0);
      navigator.vibrate(p);
      return;
    }
    let t = 0;
    p.forEach((ms,i)=>{ if(i%2===0){ t===0 ? iosTick() : setTimeout(iosTick, t); } t += ms; });
  }catch(_){}
}
function hapticLevelUp(){
  haptic("buildup");

  setTimeout(()=>haptic("sparkle"), 1250);
}

/* ============================== LEVELS ============================== */
/* Clear every due card in a session and you level up. The bar on the Level screen shows how much of
   today's due pile you've cleared; XP is a running total on top (bonuses for conquering hard cards). */
const XP_FOR = { again:2, hard:6, good:10, easy:12 };
function syncBase(){
  const g = data.game, due = dueCards().length, t = todayISO();
  let changed = false;
  if(g.day !== t){ g.day = t; g.base = due; changed = true; }
  else if(due > g.base){ g.base = due; changed = true; }
  if(changed) save();
  return due;
}
function levelProgress(){
  const due = syncBase(), base = data.game.base, done = Math.max(0, base - due);
  return { due, base, done, pct: base ? Math.min(100, Math.round(done/base*100)) : 0 };
}
function finishSession(s){
  const g = data.game, due = syncBase();
  const res = { xp:s.xp||0, reviewed:s.reviewed||0, right:s.right||0, conq:s.conq||0, leveled:false, from:g.level, level:g.level };
  if(s.dueAtStart>0 && due===0 && res.reviewed>0){      // the whole due pile is cleared → level up
    g.level++; res.level = g.level; res.leveled = true;
    g.xp += 50; res.xp += 50;                            // level-up bonus
    g.base = 0; g.day = todayISO();
  }
  save();
  return res;
}
const SHIELD_PATH = "M24 3l19 7v16c0 12-8 21-19 27C13 47 5 38 5 26V10z";

function showLevelUp(from, to, res){
  closeCelebrate();
  const cols = ["#e29a2d","#f2ca5c","#ff7a4d","#ffd54a","#ff7c5b"];
  const conf = Array.from({length:52}, (_,i)=>{
    const l = Math.random()*100, d = Math.random()*.8, w = 6 + Math.random()*7, dur = 2 + Math.random()*1.8, rot = Math.floor(Math.random()*360);
    return `<i style="left:${l}%;width:${w}px;height:${w*1.6}px;background:${cols[i%5]};animation-delay:${d}s;animation-duration:${dur}s;transform:rotate(${rot}deg)"></i>`;
  }).join("");
  const el = document.createElement("div");
  el.id = "celebrate"; el.className = "celeb";
  el.innerHTML = `<div class="confetti">${conf}</div><div class="celeb-in"><div class="celeb-k">LEVEL UP!</div><div class="celeb-badge" id="celebBadge">${shieldBadge(from, 150)}</div><div class="celeb-t">You're now Level ${to}</div><div class="celeb-s">All due cards cleared · +${res.xp} XP</div><button class="btn btn-primary" data-nohap style="width:100%" onclick="haptic('select');closeCelebrate()">Continue</button></div>`;

// Small text prompt (used for renaming). Resolves the new text, or null if cancelled.
function askText(title, value, placeholder){
  return new Promise(resolve=>{
    const el = document.createElement("div");
    el.className = "modal-bg"; el.style.zIndex = 70;
    el.innerHTML = `<div class="modal">
      <h2 style="font-size:1rem">${esc(title)}</h2>
      <input class="input" id="askTextField" style="margin-top:1rem" maxlength="80" placeholder="${esc(placeholder||"")}">
      <div class="row" style="justify-content:flex-end;margin-top:1.25rem">
        <button class="btn btn-secondary" data-c="cancel">Cancel</button>
        <button class="btn btn-primary" data-c="save">Save</button>
      </div></div>`;
    const input = el.querySelector("#askTextField");
    input.value = value || "";
    const done = v => { animateOut(el, 220); resolve(v); };
    el.addEventListener("click", e=>{
      if(e.target === el) return done(null);
      const c = e.target.closest("[data-c]")?.dataset.c;
      if(c === "cancel") done(null);
      else if(c === "save") done(input.value);
    });
    input.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); done(input.value); } });
    document.body.appendChild(el);
    setTimeout(()=>{ input.focus(); input.select(); }, 50);
  });
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch{
    // Fallback for browsers/contexts where the Clipboard API is blocked (e.g. some file:// pages).
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch{}
    ta.remove();
    return ok;
  }
}

// Ask the AI to turn one deck's raw notes into a structured study guide (Markdown).
async function aiStudyGuide(title, notesText){
  const prompt = `LANGUAGE (the most important rule): find the language the NOTES are written in and write EVERYTHING in that same language: every heading, explanation, table, question and answer. NEVER translate into English or any other language, even though these instructions are in English. If the notes mix languages, keep each term in the language it was written in and write the surrounding text in the main language of the notes.

You are a teacher turning a student's raw study notes into a STUDY GUIDE for a test. The student will read it (often printed) and must be able to learn everything from it quickly and without confusion.

TOPIC: ${title}

RULES
- The facts must come from the notes. You may add short plain-language explanations, simple examples or memory tricks, but never contradict the notes or invent facts, dates, numbers, names or formulas. If something in the notes looks wrong, keep what the notes say.
- Keep EVERY fact that could be tested. Reorganise and reword for clarity, but never drop a point.
- Merge duplicates and put related ideas together, in the order a student would best learn them (basics first).
- Use short, simple sentences. One idea per bullet. No long paragraphs.
- The section headings named below are only a guide to the structure: translate them into the language of the notes (for example into Afrikaans if the notes are Afrikaans).

STRUCTURE (use these ## sections in this order; leave one out only if the notes truly have nothing for it)
1. ## At a glance: 2-4 bullets saying what this topic is about and what matters most for the test.
2. ## Key terms: a Markdown table with the header row | Term | Meaning | covering every important term, definition, name, date and formula in the notes. Keep each Meaning to one or two short sentences.
3. One ## section for each main topic in the notes, named after the topic. Inside it: ### sub-headings where helpful, short bullets, **bold** on key terms, numbered lists for steps or processes, and a Markdown table whenever things are compared or have several attributes. Add a callout line starting with > only where it really helps, for example > **Remember:** ... for a key rule or memory trick, or > **Watch out:** ... for a common confusion. At most 1-2 callouts per section.
4. ## Common mistakes: bullets of things students mix up or get wrong on this topic.
5. ## Quick revision: the 8-15 most important points as bullets, a last-minute cheat sheet.
6. ## Practice questions: numbered test-style questions (about 10 for short notes, up to 25 for long notes) mixing recall, explain-why and application questions. Questions only, no answers.
7. A line containing exactly [[PAGEBREAK]] followed by ## Answer key: numbered answers matching the question numbers, short but complete.

FIRST LINE OF YOUR ANSWER: exactly one line in this form, with the five phrases translated into the language of the notes: [[LABELS: Study guide | Flashcard recap | Cover the Answer column and test yourself. | Question | Answer]]

FORMAT: Markdown only (## headings, ### sub-headings, **bold**, - bullets, numbered lists, | tables |, > callouts). No LaTeX or math notation (no $, \\rightarrow, \\text{}, etc.); use normal characters instead, e.g. write arrows as -> and chemical formulas as H2O. Return only the study guide, with no introduction or closing remarks.

NOTES:
${notesText}`;
  let text = cleanAiText(await gemini(prompt)).replace(/ -> /g, " → ");
  let labels = null;
  const m = text.match(/^\s*\[\[LABELS:([^\]]*)\]\]\s*$/m);
  if(m){
    const p = m[1].split("|").map(x => x.trim());
    if(p.length >= 5 && p.slice(0, 5).every(Boolean)) labels = { sub:p[0], cards:p[1], cover:p[2], q:p[3], a:p[4] };
    text = text.replace(m[0], "").trim();
  }
  return { text, labels };
}
