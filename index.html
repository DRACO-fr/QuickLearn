  const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${W}><w:p><w:pPr><w:jc w:val="center"/></w:pPr>${fld(`<w:t xml:space="preserve">${xe(title)}  ·  Page </w:t>`)}${fld('<w:fldChar w:fldCharType="begin"/>')}${fld('<w:instrText xml:space="preserve"> PAGE </w:instrText>')}${fld('<w:fldChar w:fldCharType="separate"/>')}${fld("<w:t>1</w:t>")}${fld('<w:fldChar w:fldCharType="end"/>')}</w:p></w:ftr>`;
  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}>
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="${L0.lang || "en-ZA"}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
<w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="60"/></w:pPr><w:rPr><w:b/><w:color w:val="1F3864"/><w:sz w:val="52"/><w:szCs w:val="52"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Subtitle"><w:name w:val="Subtitle"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="240"/></w:pPr><w:rPr><w:color w:val="7F7F7F"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="2F5496"/></w:pBdr><w:spacing w:before="320" w:after="120"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="2F5496"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:color w:val="2F5496"/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="Heading3"><w:name w:val="heading 3"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="180" w:after="60"/><w:outlineLvl w:val="2"/></w:pPr><w:rPr><w:b/><w:color w:val="1F3864"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:style>
<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="60"/></w:pPr></w:style>
</w:styles>`;
  const bullets = ["•", "◦", "▪"];
  let numberingXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering ${W}>`;
  numberingXml += `<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>` + bullets.map((b, l) => `<w:lvl w:ilvl="${l}"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="${b}"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="${720 * (l + 1)}" w:hanging="360"/></w:pPr></w:lvl>`).join("") + `</w:abstractNum>`;
  numberingXml += `<w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>`;
  numberingXml += `<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>`;
  ctx.defs.forEach(d => { numberingXml += `<w:num w:numId="${d.id}"><w:abstractNumId w:val="1"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="${d.start}"/></w:lvlOverride></w:num>`; });
  numberingXml += `</w:numbering>`;
  const R = "http://schemas.openxmlformats.org/package/2006/relationships";
  const RT = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const CT = "application/vnd.openxmlformats-officedocument.wordprocessingml";
  return zipStore([
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CT}.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CT}.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="${CT}.numbering+xml"/><Override PartName="/word/footer1.xml" ContentType="${CT}.footer+xml"/></Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${R}"><Relationship Id="rId1" Type="${RT}/officeDocument" Target="word/document.xml"/></Relationships>` },
    { name:"word/_rels/document.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${R}"><Relationship Id="rId1" Type="${RT}/styles" Target="styles.xml"/><Relationship Id="rId2" Type="${RT}/numbering" Target="numbering.xml"/><Relationship Id="rId3" Type="${RT}/footer" Target="footer1.xml"/></Relationships>` },
    { name:"word/document.xml", data:documentXml },
    { name:"word/styles.xml", data:stylesXml },
    { name:"word/numbering.xml", data:numberingXml },
    { name:"word/footer1.xml", data:footerXml }
  ]);
}

// Ask the AI to turn one deck's raw notes into a structured study guide (Markdown).
async function aiStudyGuide(title, notesText){
  const prompt = `LANGUAGE (the most important rule): find the language the NOTES are written in and write EVERYTHING in that same language: every heading, explanation, table, question and answer. NEVER translate into English or any other language, even though these instructions are in English. If the notes mix languages, keep each term in the language it was written in and write the surrounding text in the main language of the notes.

You are a teacher turning a student's raw study notes into a STUDY GUIDE for a test. The student will read it (often printed) and must be able to learn everything from it quickly and without confusion.

TOPIC: ${title}

RULES
- The facts must come from the notes. You may add short plain-language explanations, simple examples or memory tricks, but never contradict the notes or invent facts, dates, numbers, names or formulas. If something in the notes looks wrong, keep what the notes say.
- Keep EVERY fact that could be tested. Reorganise and reword for clarity, but never drop a point.
- Merge duplicates and put related ideas together, in the order a student would best learn them (basics first).
- Use short, simple sentences. One idea per bullet. No long paragraphs.
- The section headings named below are only a guide to the structure: translate them into the language of the notes (for example into Afrikaans if the notes are Afrikaans).

STRUCTURE (use these ## sections in this order; leave one out only if the notes truly have nothing for it)
1. ## At a glance: 2-4 bullets saying what this topic is about and what matters most for the test.
2. ## Key terms: a Markdown table with the header row | Term | Meaning | covering every important term, definition, name, date and formula in the notes. Keep each Meaning to one or two short sentences.
3. One ## section for each main topic in the notes, named after the topic. Inside it: ### sub-headings where helpful, short bullets, **bold** on key terms, numbered lists for steps or processes, and a Markdown table whenever things are compared or have several attributes. Add a callout line starting with > only where it really helps, for example > **Remember:** ... for a key rule or memory trick, or > **Watch out:** ... for a common confusion. At most 1-2 callouts per section.
4. ## Common mistakes: bullets of things students mix up or get wrong on this topic.
5. ## Quick revision: the 8-15 most important points as bullets, a last-minute cheat sheet.
6. ## Practice questions: numbered test-style questions (about 10 for short notes, up to 25 for long notes) mixing recall, explain-why and application questions. Questions only, no answers.
7. A line containing exactly [[PAGEBREAK]] followed by ## Answer key: numbered answers matching the question numbers, short but complete.

FIRST LINE OF YOUR ANSWER: exactly one line in this form, with the five phrases translated into the language of the notes: [[LABELS: Study guide | Flashcard recap | Cover the Answer column and test yourself. | Question | Answer]]

FORMAT: Markdown only (## headings, ### sub-headings, **bold**, - bullets, numbered lists, | tables |, > callouts). No LaTeX or math notation (no $, \\rightarrow, \\text{}, etc.); use normal characters instead, e.g. write arrows as -> and chemical formulas as H2O. Return only the study guide, with no introduction or closing remarks.

NOTES:
${notesText}`;
  let text = cleanAiText(await gemini(prompt)).replace(/ -> /g, " → ");
  let labels = null;
  const m = text.match(/^\s*\[\[LABELS:([^\]]*)\]\]\s*$/m);
  if(m){
    const p = m[1].split("|").map(x => x.trim());
    if(p.length >= 5 && p.slice(0, 5).every(Boolean)) labels = { sub:p[0], cards:p[1], cover:p[2], q:p[3], a:p[4] };
    text = text.replace(m[0], "").trim();
  }
  return { text, labels };
}

// Pick one or more decks; their notes are combined into a single Word document.
let docBusy = false, docRun = 0;
function openWordDocModal(){
  const decks = data.decks.filter(d => deckNotes(d.id).length);
  if(!decks.length){ closeModal(); toast("Add some notes to a deck first."); return; }
  const opt = (inner) => `<label class="quiz-opt" style="display:flex;align-items:flex-start;gap:.75rem;cursor:pointer">${inner}</label>`;

    <div class="row" style="justify-content:space-between;margin-top:1rem">
      <button class="btn btn-secondary" id="docAllBtn" style="min-height:36px;font-size:.8rem" onclick="toggleDocAll()">Select all</button>
      <span class="muted" id="docCount" style="font-size:.8rem"></span>
    </div>
    <div id="docDecks" style="margin-top:.75rem;max-height:34vh;overflow-y:auto">
      ${decks.map(d => { const c = deckNotes(d.id).length; return opt(`
        <input type="checkbox" value="${d.id}" onchange="updateDocCount()" style="width:1.1rem;height:1.1rem;accent-color:var(--primary);flex:none;margin-top:.1rem">
        <span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(d.title)}</span>
        <span class="muted" style="flex:none;font-size:.75rem">${c} note${c===1?"":"s"}</span>`); }).join("")}
    </div>
    <div class="label" style="margin-top:1rem">Document type</div>
    ${opt(`<input type="radio" name="docMode" value="guide" checked style="width:1.1rem;height:1.1rem;accent-color:var(--primary);flex:none;margin-top:.1rem">
      <span style="flex:1;min-width:0"><b>Study guide</b><br><span class="muted" style="font-size:.78rem">AI organises your notes into key terms, clear sections, a quick-revision list and practice questions with a separate answer key. Needs internet.</span></span>`)}
    ${opt(`<input type="radio" name="docMode" value="raw" style="width:1.1rem;height:1.1rem;accent-color:var(--primary);flex:none;margin-top:.1rem">
      <span style="flex:1;min-width:0"><b>Raw notes</b><br><span class="muted" style="font-size:.78rem">Your notes exactly as you wrote them. Works offline.</span></span>`)}
    ${data.cards.length ? opt(`<input type="checkbox" id="docCards" checked style="width:1.1rem;height:1.1rem;accent-color:var(--primary);flex:none;margin-top:.1rem">
      <span style="flex:1;min-width:0"><b>Add my flashcards</b><br><span class="muted" style="font-size:.78rem">A question and answer table at the end of each deck.</span></span>`) : ""}
    <div id="docStatus" style="margin-top:.75rem"></div>
    <div class="row" style="justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-secondary" onclick="docRun++;docBusy=false;closeModal()">Cancel</button>
      <button class="btn btn-primary" id="docStartBtn" onclick="createWordDoc()">Create Word doc</button>
    </div>`);
  updateDocCount();
}
function docBoxes(){ return Array.from(document.querySelectorAll("#docDecks input[type=checkbox]")); }
function toggleDocAll(){
  const boxes = docBoxes(), all = boxes.every(b => b.checked);
  boxes.forEach(b => b.checked = !all);
  updateDocCount();
}
function updateDocCount(){
  const boxes = docBoxes(), on = boxes.filter(b => b.checked);
  const cnt = document.getElementById("docCount");
  if(cnt) cnt.textContent = on.length ? `${on.length} deck${on.length===1?"":"s"} selected` : "None selected";
  const all = document.getElementById("docAllBtn");
  if(all) all.textContent = boxes.length && on.length === boxes.length ? "Deselect all" : "Select all";
  const start = document.getElementById("docStartBtn");
  if(start) start.disabled = !on.length || docBusy;
}
function setDocStatus(html, isError){
  const el = document.getElementById("docStatus");
  if(el) el.innerHTML = html ? (isError ? errBox(html) : `<div class="panel" style="font-size:.85rem">${html}</div>`) : "";
}
async function createWordDoc(){
  if(docBusy){ toast("Still writing your study guide…"); return; }
  const ids = docBoxes().filter(b => b.checked).map(b => b.value);
  if(!ids.length){ toast("Pick at least one deck"); return; }
  const mode = document.querySelector("input[name=docMode]:checked")?.value || "guide";
  const withCards = !!document.getElementById("docCards")?.checked;
  const sections = ids.map(id => ({ title: data.decks.find(d => d.id === id)?.title || "Untitled deck", notes: deckNotes(id), cards: withCards ? deckCards(id) : [] })).filter(sec => sec.notes.length);
  if(!sections.length){ toast("Those decks have no notes"); return; }
  if(mode === "guide" && !getKey()){
    setDocStatus("Study guides need your Gemini API key. Add it with the <b>AI key</b> button (top right), or choose <b>Raw notes</b> to export without AI.", true);
    return;
  }
  const run = ++docRun;
  docBusy = true; updateDocCount();
  try{
    if(mode === "guide"){
      for(let i = 0; i < sections.length; i++){
        setDocStatus(`<span class="spin"></span> Writing study guide ${i + 1} of ${sections.length}: ${esc(sections[i].title)}… this can take a minute.`);
        const g = await aiStudyGuide(sections[i].title, sections[i].notes.map(n => n.content).join("\n\n---\n\n"));
        if(run !== docRun) return; // cancelled
        if(!g.text.trim()) throw new Error("The AI sent back an empty answer. Please try again.");
        sections[i].guide = g.text;
        sections[i].aiLabels = g.labels;
      }
    }
    const multi = sections.length > 1;
    // labels for the fixed parts: the AI's own (guide mode) or Afrikaans/English picked from the notes themselves
    sections.forEach(sec => {
      const base = DOC_LABELS[docLangOf(sec.notes.map(n => n.content).join(" "))];
      sec.labels = Object.assign({}, base, sec.aiLabels || {});
    });
    const L = sections[0].labels;
    const subtitle = mode === "guide" ? L.sub : L.subRaw;
    const title = multi ? subtitle : sections[0].title;
    const blob = buildDocx(title, sections, { subtitle, labels: L });
    const base = title.replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 60) || "notes";
    const fname = (mode === "guide" && !multi ? base + " - " + subtitle : base) + ".docx";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if(document.getElementById("docStatus")) closeModal();
    toast(mode === "guide" ? "Study guide created" : "Word document created");
    notifyLocal("QuickLearn", mode === "guide" ? "Your study guide is ready" : "Your Word document is ready", "#/");
  }catch(e){
    console.error(e);
    setDocStatus(esc(e.message || "Couldn't create the Word document") + (mode === "guide" ? "<br><span class='muted'>You can try again, or choose Raw notes to export without AI.</span>" : ""), true);
    if(!document.getElementById("docStatus")) toast("Couldn't create the Word document");
  }finally{
    if(run === docRun){ docBusy = false; updateDocCount(); }
  }
}
async function renameDeck(id){

// Shown when automatic retries all fail: explains why, lists the downsides of the
// backup model, and lets the person choose. Resolves "fallback" | "retry" | "cancel".
function askFallback(status){
  return new Promise(resolve=>{
    const el = document.createElement("div");
    el.className = "modal-bg"; el.style.zIndex = 70;
    const why = status === 429
      ? "You've hit Gemini's request limit for the moment, so Google is turning requests away."
      : "The servers for this AI model have high traffic right now, so Google turned the request away" + (status ? ` (error ${status})` : " or couldn't be reached") + ".";
    el.innerHTML = `<div class="modal">
      <h2 style="font-size:1rem">Gemini is busy right now</h2>
      <p class="muted" style="margin:.5rem 0 0">${why} The app already retried ${RETRY_DELAYS.length} times automatically.</p>
      <p style="margin:1rem 0 .3rem;font-size:.85rem;font-weight:700">You can switch to a lighter backup model, but:</p>
      <ul class="muted" style="margin:0;padding-left:1.1rem;line-height:1.55">
        <li><b style="color:var(--foreground)">Less accurate.</b> It can misread photos and PDFs, so double-check exam dates after importing a timetable and review flashcards it writes.</li>
        <li><b style="color:var(--foreground)">Less consistent.</b> It sometimes ignores the requested format, so imports or flashcard generation may fail and need another try.</li>
      </ul>
      <div style="display:flex;flex-direction:column;gap:.5rem;margin-top:1.25rem">
        <button class="btn btn-primary" data-c="fallback">Use backup model</button>
        <button class="btn btn-secondary" data-c="retry">Try the main model again</button>
        <button class="btn btn-ghost" data-c="cancel">Cancel</button>
      </div></div>`;
    el.addEventListener("click", e=>{
      const c = e.target.closest("[data-c]")?.dataset.c;
      if(!c) return;
      animateOut(el, 220); resolve(c);
    });
    document.body.appendChild(el);
  });
}

// files = [{ dataUrl }] (JPEG data URLs from filesToImages)
async function gemini(prompt, files, options={}){
  const key = getKey();
  if(!key) throw new Error("Add your Gemini API key first (AI key button, top right). Get a free one at aistudio.google.com/apikey");
  if(navigator.onLine === false) throw new Error("You're offline — AI features need an internet connection. Everything else still works.");
  const parts = [{text:prompt}];
  if(files && files.length){
    files.slice(0,8).forEach(f => parts.push({ inline_data:{ mime_type:"image/jpeg", data:f.dataUrl.split(",")[1] } }));
  }
  const body = JSON.stringify({ contents:[{ parts }] });
  let model = GEMINI_MODEL;
  while(true){
    let lastStatus = 0;
    for(let attempt = 0; attempt <= RETRY_DELAYS.length; attempt++){
      let res = null;
      try{
        res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key), {
          method:"POST", headers:{"Content-Type":"application/json"}, body
        });
      }catch(e){ // network hiccup: treat like a busy server, unless we've actually gone offline
        if(navigator.onLine === false) throw new Error("You lost your internet connection — AI features need it. Everything else still works.");
        res = null;
      }
      if(res && res.ok){
        const j = await res.json();
        return j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "";
      }
      if(res && !RETRYABLE.includes(res.status)){
        const t = await res.text();
        if(res.status===400||res.status===403) throw new Error("API key rejected — check it in the AI key dialog.");
        if(options.autoFallback && model !== GEMINI_FALLBACK_MODEL){
          model = GEMINI_FALLBACK_MODEL;
          toast("Course creation is switching to the backup AI automatically…");
          attempt = -1;
          continue;
        }
        throw new Error("Gemini error " + res.status + ": " + t.slice(0,120));
      }
      lastStatus = res ? res.status : 0;
      if(attempt < RETRY_DELAYS.length){
        toast(`Servers are busy — retrying automatically (${attempt+1}/${RETRY_DELAYS.length})…`);
        await sleep(RETRY_DELAYS[attempt]);
      }
    }
    // All automatic retries failed. Course generation alone may switch models silently.
    if(model === GEMINI_FALLBACK_MODEL) throw new Error("Gemini is still too busy even on the backup model. Please try again in a few minutes.");
    if(options.autoFallback){
      model = GEMINI_FALLBACK_MODEL;
      toast("Course creation is switching to the backup AI automatically…");
      continue;
    }
    const choice = await askFallback(lastStatus);
    if(choice === "fallback") model = GEMINI_FALLBACK_MODEL;
    else if(choice !== "retry") throw new Error("Cancelled — Gemini's servers are busy right now. Try again in a few minutes.");
  }
}
// Turn photos / PDFs into downscaled JPEG data URLs that Gemini accepts.
// PDF pages are rendered with pdf.js (loaded on demand).
function loadScript(src){
  return new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = ()=>rej(new Error("Couldn't load the PDF reader — check your connection."));
    document.head.appendChild(s);
  });
}
function canvasToJpeg(canvas, maxSide){
  const sc = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
  const out = document.createElement("canvas");
  out.width = Math.round(canvas.width*sc); out.height = Math.round(canvas.height*sc);
  out.getContext("2d").drawImage(canvas, 0, 0, out.width, out.height);
  return out.toDataURL("image/jpeg", 0.85);
}
function imageFileToJpeg(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext("2d").drawImage(img,0,0);
      URL.revokeObjectURL(url);
      res(canvasToJpeg(c, 1600));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that image.")); };
    img.src = url;
  });
}
async function pdfToJpegs(file){
  if(!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for(let p=1; p<=Math.min(pdf.numPages, 8); p++){
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1.6 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    pages.push(canvasToJpeg(c, 1600));
  }
  return pages;
}
// Returns up to 8 [{dataUrl}] images from any mix of photos and PDFs.
async function filesToImages(fileList){
  const out = [];
  for(const f of Array.from(fileList||[])){
    if(f.type === "application/pdf" || /\.pdf$/i.test(f.name)) (await pdfToJpegs(f)).forEach(d=>out.push({dataUrl:d}));
    else out.push({ dataUrl: await imageFileToJpeg(f) });
    if(out.length >= 8) break;
  }
  return out.slice(0,8);
}
// The model sometimes answers with Markdown bold (**word**) or LaTeX math
// notation ($\rightarrow$, \text{H}_2\text{O}) even when asked not to.
// This app just displays plain text, so strip that formatting down to
// readable plain text instead of showing the raw symbols.
function cleanAiText(t){
  return (t || "")
    .replace(/\$\$?/g, "")
    .replace(/\\text\{([^}]*)\}/g, "$1")
    .replace(/\\mathrm\{([^}]*)\}/g, "$1")
    .replace(/\\rightarrow/g, "→")
    .replace(/\\leftarrow/g, "←")
    .replace(/\\leftrightarrow/g, "↔")
    .replace(/\\Rightarrow/g, "⇒")
    .replace(/\\times/g, "×")
    .replace(/\\div/g, "÷")
    .replace(/\\pm/g, "±")
    .replace(/\\Delta/g, "Δ")
    .replace(/\\approx/g, "≈")
    .replace(/\\neq/g, "≠")
    .replace(/\\leq/g, "≤")
    .replace(/\\geq/g, "≥")
    .replace(/\\%/g, "%")
    .replace(/_\{?(\d+)\}?/g, "$1")
    .replace(/\^\{?(\d+)\}?/g, "$1")
    .replace(/\\\\/g, "")
    .trim();
}

// Plain-text version (for flashcards, search previews, copying): removes Markdown symbols.
function stripMd(t){
  return cleanAiText(t)
    .replace(/^\s{0,3}#{1,6}\s*/gm, "")
    .replace(/^(\s*)[*-]\s+/gm, "$1• ")
    .replace(/\*\*([\s\S]*?)\*\*/g, "$1")
    .replace(/\*([^*\n]+)\*/g, "$1")
    .replace(/__([^_]+)__/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/^[-*_]{3,}\s*$/gm, "")
    .trim();
}
// Renders Markdown (headings, bold, italic, bullets, numbered lists) as safe HTML.
function inlineMd(h){ // h is already HTML-escaped
  return h
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_]+?)__/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
}
function md(text){
  const lines = String(text ?? "").replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if(para.length){ html += "<p>" + para.join("<br>") + "</p>"; para = []; } };
  const closeList = () => { if(list){ html += "</" + list + ">"; list = null; } };
  const openList = type => { if(list !== type){ closeList(); html += "<" + type + ">"; list = type; } };
  for(const raw of lines){
    let m;
    if(!raw.trim()){ flushPara(); closeList(); continue; }
    if(/^\s*[-*_]{3,}\s*$/.test(raw)){ flushPara(); closeList(); html += "<hr>"; continue; }
    if((m = raw.match(/^\s{0,3}(#{1,6})\s+(.*)$/))){
      flushPara(); closeList();
      const tag = m[1].length <= 2 ? "h3" : "h4";
      html += "<" + tag + ">" + inlineMd(esc(m[2].replace(/\s*#+\s*$/, ""))) + "</" + tag + ">";
      continue;
    }
    if((m = raw.match(/^(\s*)[-*•]\s+(.*)$/))){
      flushPara(); openList("ul");
      const depth = Math.min(Math.floor(m[1].length / 2), 3);
      html += "<li" + (depth ? ` style="margin-left:${depth * 1.1}rem"` : "") + ">" + inlineMd(esc(m[2])) + "</li>";
      continue;
    }
    if((m = raw.match(/^(\s*)(\d+)[.)]\s+(.*)$/))){
      flushPara();
      if(list !== "ol"){ closeList(); html += `<ol start="${m[2]}">`; list = "ol"; }
      html += "<li>" + inlineMd(esc(m[3])) + "</li>";
      continue;
    }
    closeList();
    para.push(inlineMd(esc(raw.trim())));
  }
  flushPara(); closeList();
  return html;
}

// Plays the closing animation, then removes the element (instantly when motion is reduced).
function animateOut(el, ms){
  if(!el || el.dataset.closing) return;
  el.dataset.closing = "1";
  if(motionReduced()){ el.remove(); return; }
  el.classList.add("closing");
  setTimeout(()=>el.remove(), ms || 260);
}
function toast(msg, kind){
  kind = kind || toastKind(String(msg));
  const root = document.getElementById("toast-root");
  while(root.children.length >= 3) root.firstElementChild.remove();
  const t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.setAttribute("role", kind === "error" ? "alert" : "status");
  const ic = kind === "error" ? "!" : kind === "success" ? "✓" : kind === "warn" ? "!" : "";
  t.innerHTML = (ic ? `<span class="ti" aria-hidden="true">${ic}</span>` : "") + `<span class="tm">${esc(msg)}</span>`;
  t.onclick = () => animateOut(t, 220);
  root.appendChild(t);
  setTimeout(()=>animateOut(t, 220), kind === "error" ? 4600 : 3000);
}

// Themed replacement for the browser's confirm(): resolves true / false.
function askConfirm(title, message, okLabel, danger){
  return new Promise(resolve=>{
    const el = document.createElement("div");
    el.className = "modal-bg dlg" + (danger ? " danger" : ""); el.style.zIndex = 70;
    el.setAttribute("role","alertdialog"); el.setAttribute("aria-modal","true");
    el.innerHTML = `<div class="modal"><div class="dlg-ic" aria-hidden="true">${danger?"🗑️":"❔"}</div><h2>${esc(title)}</h2><p>${esc(message||"")}</p>
      <div class="dlg-btns"><button class="btn btn-secondary" data-c="no">Cancel</button><button class="btn ${danger?"btn-danger2":"btn-primary"}" data-c="yes">${esc(okLabel||"Confirm")}</button></div></div>`;
    const done = v => { document.removeEventListener("keydown", onKey); animateOut(el, 220); resolve(v); };
    const onKey = e => { if(e.key === "Escape") done(false); };
    el.addEventListener("click", e=>{
      if(e.target === el) return done(false);
      const c = e.target.closest("[data-c]")?.dataset.c;
      if(c) done(c === "yes");
    });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(el);
    setTimeout(()=>el.querySelector('[data-c="yes"]')?.focus(), 60);
  });
}

// Drag the sheet's handle down to close it.
(function(){
  const root = document.getElementById("modal-root");
  let g = null;
  root.addEventListener("pointerdown", e=>{
    const grab = e.target.closest(".grab"); if(!grab) return;
    const modal = grab.closest(".modal"), bg = modal.parentNode;
    if(bg.classList.contains("closing")) return;
    g = { id:e.pointerId, y0:e.clientY, t0:performance.now(), dy:0, modal, bg, grab, h:modal.offsetHeight };
    try{ grab.setPointerCapture(e.pointerId); }catch(_){}
    modal.style.animation = "none"; modal.style.transition = "none";
  });
  root.addEventListener("pointermove", e=>{
    if(!g || e.pointerId !== g.id) return;
    g.dy = Math.max(0, e.clientY - g.y0);
    g.modal.style.transform = `translateY(${g.dy}px)`;
    g.bg.style.opacity = String(1 - Math.min(1, g.dy / g.h) * .75);
  });
  const end = e=>{
    if(!g || e.pointerId !== g.id) return;
    const { modal, bg, dy, t0, h } = g; g = null;
    const fast = dy / Math.max(1, performance.now() - t0) > .6;
    if(dy > 110 || fast){
      clearTimeout(_modalTimer);
      if(motionReduced()){ root.innerHTML = ""; return; }
      bg.style.pointerEvents = "none";
      modal.style.transition = "transform .22s cubic-bezier(.4,0,1,1)"; bg.style.transition = "opacity .22s";
      modal.style.transform = "translateY(105%)"; bg.style.opacity = "0";
      _modalTimer = setTimeout(()=>{ if(bg.parentNode === root) root.innerHTML = ""; }, 240);
      haptic("tap");
    } else {
      modal.style.transition = "transform .3s var(--spring)"; bg.style.transition = "opacity .3s";
      modal.style.transform = ""; bg.style.opacity = "";
    }
  };
  root.addEventListener("pointerup", end); root.addEventListener("pointercancel", end);
})();

    const text = await gemini(prompt, images);

/* Shared session used by BOTH deck study and "Study all" — fixes the bug where
   cards wouldn't advance/flip in the Study tab. State lives in one object and
   every interaction re-renders from it. */
let session = null; // {cards, idx, flipped, back, title}

function startSession(cards, title, back){
  if(!cards.length) return;
  // hardest cards first, everything else shuffled
  const hard = cards.filter(isHard).sort((a,b)=>hardScore(b)-hardScore(a));
  const rest = cards.filter(c=>!isHard(c)).sort(()=>Math.random()-.5);
  session = { cards:[...hard, ...rest], idx:0, flipped:false, back, title, dueAtStart:dueCards().length, xp:0, reviewed:0, right:0, conq:0 };
  renderSession();
}
function flipCard(){
  if(!session) return;
  session.flipped = !session.flipped; session.anim = true;
  haptic("flip");
  renderSession();
}
function toggleHardInSession(id){ toggleHard(id); renderSession(); }
function rate(r){
  markPractice();
  const card = session.cards[session.idx];
  const res = rateCard(card.id, r);
  const g = data.game;
  let xp = XP_FOR[r];
  if(res.wasHard && (r==="good" || r==="easy")) xp += 5;
  const conquered = res.wasHard && !res.nowHard;       // a hard card finally tamed
  if(conquered){ xp += 15; g.conquered = (g.conquered||0) + 1; session.conq++; }
  g.xp += xp; session.xp += xp; session.reviewed++; logReview(card, r);
  if(r==="good" || r==="easy") session.right++;
  const deck = data.decks.find(d=>d.id===card.deckId);
  if(deck && deck.subjectId){
    data.studyFreq = data.studyFreq || {};
    data.studyFreq[deck.subjectId] = (data.studyFreq[deck.subjectId]||0) + 1;
  }
  save();
  haptic(r);
  floatXP(conquered ? `+${xp} XP · hard card conquered 💪` : `+${xp} XP`);
  if(r==="again"){                                      // a miss comes straight back a few cards later
    session.cards.splice(Math.min(session.cards.length, session.idx + 4), 0, card);
  }
  session.idx++;
  session.flipped = false;
  renderSession();
}

// ---------- analytics / mastery radar chart ----------
function polygonPoints(n, cx, cy, r, scale){
  const pts = [];
  for(let i=0;i<n;i++){
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    pts.push([cx + r*scale*Math.cos(angle), cy + r*scale*Math.sin(angle)]);
  }
  return pts;
}
// Mastery 0-100 for a subject: the latest evaluation score if there is one,
// otherwise estimated from how well its flashcards are known (spaced-repetition
// interval), so the chart fills in as you study even before you run an evaluation.
function masteryOf(s){
  const ev = data.subjectScores[s.id];
  if(ev && typeof ev.score === "number") return ev.score;
  const cards = data.decks.filter(d=>d.subjectId===s.id).flatMap(d=>deckCards(d.id));
  if(!cards.length) return 0;
  const sum = cards.reduce((a,c)=> a + (c.repetitions>0 ? 0.25 + 0.75*Math.min(c.interval/21,1) : 0), 0);
  return Math.round(sum/cards.length*100);
}
function renderRadarSVG(subjects){
  const n = subjects.length;
  const cx=130, cy=130, R=96;
  const pcts = subjects.map(masteryOf);
  // Keep a small visible floor so even a 0% subject doesn't collapse the shape to a point.
  const scores = pcts.map(p => Math.max(p, 4)/100);
  const outerPts = polygonPoints(n, cx, cy, R, 1);
  const dataPts = outerPts.map((p,i)=>{
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    return [cx + R*scores[i]*Math.cos(angle), cy + R*scores[i]*Math.sin(angle)];
  });
  const gridPolys = [0.25,0.5,0.75,1].map(lvl =>
    polygonPoints(n,cx,cy,R,lvl).map(p=>p.join(",")).join(" ")
  );
  const axisLines = outerPts.map(p=>`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join("");
  const dataPoly = dataPts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
  const labels = outerPts.map((p,i)=>{
    const angle = -Math.PI/2 + i*(2*Math.PI/n);
    const lx = cx + (R+20)*Math.cos(angle);
    const ly = cy + (R+20)*Math.sin(angle);
    const label = (subjects[i].name||"").trim().slice(0,3).toUpperCase() + " " + pcts[i] + "%";
    return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" font-weight="700" fill="${pcts[i]>0?"var(--foreground)":"var(--muted-fg)"}" text-anchor="middle" dominant-baseline="middle">${esc(label)}</text>`;
  }).join("");
  // Square, outlined vertices like a pixel-style stat chart.
  const dots = dataPts.map(p=>`<rect x="${(p[0]-4.5).toFixed(1)}" y="${(p[1]-4.5).toFixed(1)}" width="9" height="9" fill="var(--foreground)" stroke="var(--background)" stroke-width="2"/>`).join("");
  return `<svg viewBox="-10 -4 280 270" style="width:100%;max-width:340px;display:block;margin:0 auto">
    ${gridPolys.map(gp=>`<polygon points="${gp}" fill="none" stroke="var(--border)" stroke-width="1.5"/>`).join("")}
    ${axisLines}
    <polygon points="${dataPoly}" fill="color-mix(in oklab, var(--primary) 45%, transparent)" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}
function renderAnalytics(){
  const subjects = data.subjects;
  const freq = data.studyFreq || {};
  const ranked = [...subjects].sort((a,b)=>(freq[b.id]||0)-(freq[a.id]||0));
  const top = ranked.filter(s=>(freq[s.id]||0)>0).slice(0,3);
  const chartHtml = subjects.length>=3
    ? renderRadarSVG(subjects)
    : `<div class="empty">Create at least 3 folders in Library to unlock your mastery chart.</div>`;
  const rows = subjects.length ? subjects.map(s=>{
    const sc = data.subjectScores[s.id];
    const subjDecks = data.decks.filter(d=>d.subjectId===s.id);
    const cardsN = subjDecks.reduce((a,d)=>a+deckCards(d.id).length,0);
    const dueN = subjDecks.reduce((a,d)=>a+dueCards(d.id).length,0);
    return `<div class="panel" style="margin-top:.6rem">
      <div class="row" style="justify-content:space-between">
        <div class="deck-title">${esc(s.name)}</div>
        <button class="btn btn-secondary" style="padding:0 .7rem;min-height:30px;font-size:.72rem" onclick="startEvaluation('${s.id}')">Evaluate</button>
      </div>
      <div class="muted" style="font-size:.78rem;margin-top:.4rem">
        ${sc ? `${sc.score}% mastery · evaluated ${sc.date}` : `${masteryOf(s)}% est. mastery · not evaluated yet`}
        · ${subjDecks.length} deck${subjDecks.length===1?"":"s"} · ${cardsN} card${cardsN===1?"":"s"}${dueN?` · ${dueN} due`:""}
        · studied ${freq[s.id]||0}×
      </div>
    </div>`;
  }).join("") : `<div class="empty">Create folders in Library to start tracking your subjects.</div>`;
  return `
    <h2 class="label">Your mastery</h2>
    <div class="panel" style="margin-top:.5rem">${chartHtml}</div>
    ${top.length ? `<div class="muted" style="margin-top:.6rem;font-size:.8rem">Most studied: ${top.map(s=>esc(s.name)).join(", ")}</div>` : ""}
    ${subjects.length ? `<h2 class="label">By subject</h2>${rows}` : ""}`;
}

// Build a shuffled list of question types so a quiz mixes multiple-choice,
// typed-recall, and fill-in-the-blank questions instead of always MCQ.
function buildQuizTypes(n){
  const base = ["mcq","typed","fillblank"];
  const types = [];
  while(types.length < n) types.push(...base);
  types.length = n;
  for(let i=types.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [types[i],types[j]]=[types[j],types[i]]; }
  return types;
}
// Pick the longest word in an answer to blank out for a fill-in-the-blank question.
function pickBlankWord(answer){
  const words = (answer||"").split(/\s+/).filter(Boolean);
  if(!words.length) return { masked:"_____", blank: answer||"" };
  let target = words[0];
  for(const w of words){
    const cw = w.replace(/[^A-Za-z0-9]/g,"");
    const ct = target.replace(/[^A-Za-z0-9]/g,"");
    if(cw.length > ct.length) target = w;
  }
  const idx = words.indexOf(target);
  const maskedWords = words.slice();
  maskedWords[idx] = "_____";
  const blank = target.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,"");
  return { masked: maskedWords.join(" "), blank };
}
function startQuiz(deckId){
  const cards = [...deckCards(deckId)].sort(()=>Math.random()-.5); // every card in the deck, shuffled
  if(!cards.length) return;
  const others = data.cards.filter(c=>c.deckId!==deckId);
  const types = buildQuizTypes(cards.length);
  const questions = cards.map((c,i)=>{
    const type = types[i];
    if(type === "mcq"){
      const pool = [...others, ...deckCards(deckId).filter(x=>x.id!==c.id)];
      const wrong = [...new Set(pool.map(x=>x.answer))].filter(a=>a!==c.answer).sort(()=>Math.random()-.5).slice(0,3);
      if(wrong.length < 1){
        // Not enough other answers in the library to build a multiple-choice
        // question — fall back to typed recall instead.
        return { type:"typed", q:c.question, correct:c.answer };
      }
      return { type, q:c.question, correct:c.answer, options:[...wrong, c.answer].sort(()=>Math.random()-.5) };
    }
    if(type === "fillblank"){
      const {masked, blank} = pickBlankWord(c.answer);
      return { type, q:c.question, correct:c.answer, masked, blank };
    }
    return { type:"typed", q:c.question, correct:c.answer };
  });
  quizState = { questions, idx:0, score:0, deckId, mode:"deck", startedAt:Date.now(), answered:0 };
  renderQuiz();
}
function nextQuizQuestion(){ quizState.idx++; renderQuiz(); }

function runEvaluation(subjectId, deckIds){
  const subj = data.subjects.find(s=>s.id===subjectId);
  if(!subj) return;
  const allDecks = data.decks.filter(d=>d.subjectId===subjectId && deckCards(d.id).length);
  const subjDecks = allDecks.filter(d=>deckIds.includes(d.id));
  const updatesMastery = subjDecks.length === allDecks.length;
  const pool = subjDecks.flatMap(d=>deckCards(d.id));
  if(pool.length < 4){ toast("Pick decks with at least 4 flashcards in total."); return; }
  const cards = [...pool].sort(()=>Math.random()-.5); // every card in the chosen decks, shuffled
  const others = data.cards.filter(c=>!subjDecks.some(d=>d.id===c.deckId));
  const types = buildQuizTypes(cards.length);
  const questions = cards.map((c,i)=>{
    const type = types[i];
    if(type === "mcq"){
      const localPool = [...others, ...pool.filter(x=>x.id!==c.id)];
      const wrong = [...new Set(localPool.map(x=>x.answer))].filter(a=>a!==c.answer).sort(()=>Math.random()-.5).slice(0,3);
      if(wrong.length < 1) return { type:"typed", q:c.question, correct:c.answer };
      return { type, q:c.question, correct:c.answer, options:[...wrong, c.answer].sort(()=>Math.random()-.5) };
    }
    if(type === "fillblank"){
      const {masked, blank} = pickBlankWord(c.answer);
      return { type, q:c.question, correct:c.answer, masked, blank };
    }
    return { type:"typed", q:c.question, correct:c.answer };
  });
  quizState = { questions, idx:0, score:0, mode:"evaluation", subjectId, subjectName:subj.name, updatesMastery, startedAt:Date.now(), answered:0 };
  renderQuiz();
}
function exitEvaluation(){
  quizState = null;
  location.hash = "#/";
  renderHome();
  window.scrollTo(0,0);
}
const QUIZ_TYPE_LABEL = { mcq:"Multiple choice", typed:"Type the answer", fillblank:"Fill in the blank" };
function quizEnterHandler(e){
  if(e.key==="Enter" && document.getElementById("blankInput")){
    e.preventDefault(); answerBlank();
  }
}
function answerMcq(btn, idx){
  const s = quizState, q = s.questions[s.idx];
  const picked = q.options[idx];
  const opts = document.querySelectorAll(".quiz-opt");
  opts.forEach(b=>b.disabled = true);
  const correct = picked === q.correct;
  haptic(correct ? "good" : "again");
  btn.classList.add(correct ? "correct" : "wrong");
  if(!correct) opts.forEach(b=>{ if(b.textContent === q.correct) b.classList.add("correct"); });
  if(correct) s.score++;
  s.answered=(s.answered||0)+1;
  setTimeout(nextQuizQuestion, 900);
}
function answerBlank(){
  document.removeEventListener("keydown", quizEnterHandler);
  const s = quizState, q = s.questions[s.idx];
  const input = document.getElementById("blankInput");
  const typed = (input.value||"").trim().toLowerCase();
  const correct = typed.length>0 && typed === q.blank.trim().toLowerCase();
  haptic(correct ? "good" : "again");
  input.disabled = true;
  document.getElementById("blankCheckBtn")?.setAttribute("disabled","disabled");
  const fb = document.getElementById("quizFeedback");
  fb.innerHTML = (correct
    ? `<div class="panel" style="border-color:var(--success)"><span style="color:var(--success);font-weight:600">Correct!</span> ${esc(q.blank)}</div>`
    : `<div class="panel" style="border-color:var(--destructive)"><span style="color:var(--destructive);font-weight:600">Not quite.</span> The missing word was "<strong>${esc(q.blank)}</strong>".</div>`)
    + `<button class="btn btn-secondary" style="margin-top:.75rem;width:100%" onclick="nextQuizQuestion()">Next</button>`;
  if(correct) s.score++;
  s.answered=(s.answered||0)+1;
}
function revealTyped(){
  const q = quizState.questions[quizState.idx];

  document.getElementById("typedRevealBtn")?.setAttribute("disabled","disabled");

/* ---- Quiz / evaluation ---- */
function renderQuiz(){
  const s=quizState,isEval=s.mode==="evaluation";
  const back=isEval?"exitEvaluation()":`exitQuiz('${s.deckId}')`;
  document.querySelector("nav.bottom").style.display="none";
  const hd=(t,r="")=>`<div class="kh"><button onclick="${back}" aria-label="Close">${IC.back}</button><h1>${t}</h1>${r}</div>`;
  if(s.idx>=s.questions.length){
    let line=`You scored ${s.score} / ${s.questions.length}`;
    if(isEval){
      const pct=Math.round(s.score/s.questions.length*100);
      if(s.updatesMastery){data.subjectScores=data.subjectScores||{};data.subjectScores[s.subjectId]={score:pct,date:todayISO(),count:s.questions.length};save();line+=` (${pct}% — ${esc(s.subjectName)} mastery updated)`;}
      else line+=` (${pct}% — selected decks only, so ${esc(s.subjectName)} mastery wasn't changed)`;
    }
    const total=s.questions.length, pct=Math.round(s.score/total*100);
    const elapsed=Math.max(1,Math.round((Date.now()-(s.startedAt||Date.now()))/1000));
    const mins=Math.floor(elapsed/60),secs=elapsed%60;
    const speed=`${mins?mins+"m ":""}${secs}s`;
    if(!s.streakRecorded){markPractice();s.streakRecorded=true;}
    view.innerHTML=hd(isEval?"Evaluation done":"Round complete")+`<section class="quiz-report">
      <div class="report-hero"><div class="report-emoji mascot-pop">${pct>=80?"🎉":pct>=50?"👏":"🌱"}</div>
        <div class="report-score">${pct}%</div><div style="font-weight:700">${pct>=80?"Brilliant work!":pct>=50?"Good progress!":"Every round makes you stronger."}</div>
        <div class="muted" style="margin-top:.35rem">${s.score} correct out of ${total}</div></div>
      <div class="report-grid"><div class="report-metric"><b>${s.score}</b><small>Correct</small></div><div class="report-metric"><b>${total-s.score}</b><small>To review</small></div><div class="report-metric"><b>${speed}</b><small>Time taken</small></div></div>
      <div class="report-bars"><div style="font-weight:700;margin-bottom:.7rem">Round breakdown</div>
        <div class="report-bar"><span>Accuracy</span><div class="report-bar-track"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>
        <div class="report-bar"><span>Needs review</span><div class="report-bar-track"><i style="width:${100-pct}%;background:linear-gradient(90deg,#ffb15f,#ff6b9a)"></i></div><b>${total-s.score}</b></div>
      </div><div class="report-note">${isEval?esc(line):`${streakBadge()} Nice consistency — your progress is saved on this device.`}</div>
      <button class="btn btn-primary" style="width:100%;margin-top:.4rem" onclick="${back}">${isEval?"Back to home":"Back to deck"}</button></section>`;
    if(!s.reportFx){s.reportFx=true;haptic("complete");}
    return;
  }
  const q=s.questions[s.idx],pct=Math.round(s.idx/s.questions.length*100);
  const head=hd(isEval?esc(s.subjectName):"Practice Test",`<span class="muted">${s.idx+1} / ${s.questions.length}</span>`)+`<div class="progress" style="margin:0 1.1rem"><div style="width:${pct}%"></div></div><div style="padding:1.1rem"><div class="muted" style="font-size:.8rem;margin-bottom:.5rem">${QUIZ_TYPE_LABEL[q.type]}</div><div class="panel" style="font-size:1.1rem;line-height:1.5;font-family:DM Sans,system-ui,sans-serif">${esc(q.q)}</div>`;
  let body;
  if(q.type==="mcq") body=`<div style="margin-top:1rem" id="quizOpts">${q.options.map((o,i)=>`<button class="quiz-opt" onclick="answerMcq(this, ${i})">${esc(o)}</button>`).join("")}</div>`;
  else if(q.type==="fillblank") body=`<div class="panel" style="margin-top:1rem;line-height:1.6">${esc(q.masked)}</div><input class="input" id="blankInput" placeholder="Type the missing word…" style="margin-top:.75rem" autocomplete="off"><button class="btn btn-primary" style="margin-top:.75rem;width:100%" id="blankCheckBtn" onclick="answerBlank()">Check</button><div id="quizFeedback" style="margin-top:.75rem"></div>`;
  else body=`<textarea class="input" id="typedInput" placeholder="Type what you remember…" style="margin-top:.75rem;min-height:5rem"></textarea><button class="btn btn-primary" style="margin-top:.75rem;width:100%" id="typedRevealBtn" onclick="revealTyped()">Reveal answer</button><div id="quizFeedback" style="margin-top:.75rem"></div>`;
  view.innerHTML=head+body+`</div>`;
  if(q.type==="fillblank"){setTimeout(()=>document.getElementById("blankInput")?.focus(),50);document.addEventListener("keydown",quizEnterHandler);}
}

function jparse(t){
  // AI replies can include a short intro, Markdown fences, or text after the JSON.
  // Extract the first complete JSON object/array instead of parsing through trailing text.
  const src=String(t??"").replace(/^\uFEFF/,"").replace(/```(?:json)?/gi,"").trim();
  let lastError=null;
  for(let start=0;start<src.length;start++){
    const first=src[start];if(first!=="{"&&first!=="[")continue;
    const stack=[];let inString=false,escaped=false,end=-1;
    for(let i=start;i<src.length;i++){
      const ch=src[i];
      if(inString){if(escaped)escaped=false;else if(ch==="\\")escaped=true;else if(ch==='"')inString=false;continue;}
      if(ch==='"'){inString=true;continue;}
      if(ch==="{"||ch==="[")stack.push(ch);
      else if(ch==="}"||ch==="]"){
        const expected=ch==="}"?"{":"[";
        if(stack.pop()!==expected)break;
        if(!stack.length){end=i+1;break;}
      }
    }
    if(end<0)continue;
    const candidate=src.slice(start,end);
    try{return JSON.parse(candidate)}catch(e){
      lastError=e;
      // Some models emit a trailing comma; safely retry after removing commas before closers.
      try{return JSON.parse(candidate.replace(/,\s*([}\]])/g,"$1"))}catch(e2){lastError=e2;}
    }
  }
  throw new Error("The AI response wasn't valid complete JSON. Please retry this batch."+(lastError?" ("+lastError.message+")":""));
}
function validCourseQuestion(q){
  if(!q || typeof q!=="object" || typeof q.q!=="string" || !q.q.trim()) return false;
  if(!["mc","tf","fb"].includes(q.t)) return false;
  if(typeof q.e!=="string") q.e="";
  if(q.t==="tf") return typeof q.a==="boolean";
  if(!Array.isArray(q.o)) return false;
  q.o=q.o.map(x=>typeof x==="string"?x.trim():"").filter(Boolean);
  if(q.o.length<2 || !Number.isInteger(q.a) || q.a<0 || q.a>=q.o.length) return false;
  if(q.t==="fb" && !q.q.includes("____")) return false;
  return true;
}

        const finalAudit=`You are a strict independent auditor. Compare the ORIGINAL SOURCE against the ACTUAL GENERATED COURSE CONTENT below. The course is not complete unless every source detail is represented accurately in the questions and their explanations. Inspect every source sentence and clause, heading, list item, definition, term, example, number, date, name, formula, unit, step, cause/effect, comparison, condition, exception and qualification. A broad topic mention is NOT coverage. A fact appearing only in a question title is NOT enough unless the question/explanation actually teaches or tests it. Do not infer coverage. Return ONLY valid JSON: {"missing":[{"title":"Specific supplemental lesson title","focus":"Exact source details absent or inadequately represented"}]}. If everything is covered, return {"missing":[]}. Report omissions conservatively; do not add outside knowledge.

ORIGINAL SOURCE:

function rollChest(miss, unit, fin){
  const r = Math.random(), t = miss === 0 ? [.15, .45] : miss < 3 ? [.04, .31] : [0, .12];
  let rar = r < t[0] ? "epic" : r < t[0] + t[1] ? "rare" : "common";
  if(unit && rar === "common") rar = "rare";
  if(fin) rar = "epic";
  const rng = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let coins = { common: rng(10, 20), rare: rng(25, 45), epic: rng(60, 100) }[rar];
  if(miss === 0) coins += 5;
  if(fin) coins += 50;
  return { rar, coins };
}

      land.push({ c, x: dx * 1.1, y: ly });

        { transform: `translate(-50%,-50%) translate(${dx * .6}px,${dy}px) scale(1) rotate(${Math.random() * 200}deg)`, opacity: 1, offset: .45 },

      ], { duration: 900 + Math.random() * 300, delay: k * 35, easing: "cubic-bezier(.3,.7,.4,1)", fill: "forwards" });

      const sr = stage.getBoundingClientRect(), ox = sr.left + sr.width / 2, oy = sr.top + sr.height * .44, cr = chip.getBoundingClientRect();
      const tx = cr.left + cr.width / 2 - ox, ty = cr.top + cr.height / 2 - oy;

/* ============================== BACKGROUND JOBS ============================== */
// AI requests run in the service worker, so they keep going when you leave a deck, switch apps
// or lock the phone. Results are saved the moment they arrive, and a notification tells you when
// they're ready. Jobs are remembered on the device, so a finished job is still picked up
// if the app was closed in the meantime.
const JOBS_KEY = "quicklearn-jobs";
const JOBS_CACHE = "quicklearn-jobs";
const JOB_NAME = { cards:"flashcards", summarize:"summary", improve:"improved notes", scan:"scanned notes", refine:"refined note" };
let jobs = (()=>{ try{ return JSON.parse(localStorage.getItem(JOBS_KEY)) || []; }catch(_){ return []; } })();
function saveJobs(){ try{ localStorage.setItem(JOBS_KEY, JSON.stringify(jobs)); }catch(_){} }
function deckNameOf(id){ return data.decks.find(d=>d.id===id)?.title || "your deck"; }

function askNotifyPermission(){
  try{ if("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }catch(_){}
}
async function notifyLocal(title, body, hash){
  try{
    if(!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
    const reg = await navigator.serviceWorker.getRegistration(); if(!reg) return;
    await reg.showNotification(title, { body, icon:"icon-192.png", badge:"icon-192.png", tag:"quicklearn-"+Date.now(), data:{ hash } });
  }catch(_){}
}

function sendToWorker(payload){
  return new Promise(async res => {
    try{
      if(!("serviceWorker" in navigator)) return res(false);
      const reg = await navigator.serviceWorker.getRegistration();
      const sw = navigator.serviceWorker.controller || (reg && reg.active);
      if(!sw) return res(false);
      const mc = new MessageChannel();
      const t = setTimeout(()=>res(false), 2500);
      mc.port1.onmessage = e => { clearTimeout(t); res(e.data === "ack"); };
      sw.postMessage(Object.assign({ type:"gen", models:[GEMINI_MODEL, GEMINI_FALLBACK_MODEL], delays:RETRY_DELAYS, retryable:RETRYABLE }, payload), [mc.port2]);
    }catch(_){ res(false); }
  });
}

async function startJob(kind, deckId, prompt, files, then){
  const key = getKey();
  if(!key) throw new Error("Add your Gemini API key first (AI key button, top right). Get a free one at aistudio.google.com/apikey");
  if(navigator.onLine === false) throw new Error("You're offline — AI features need an internet connection. Everything else still works.");
  const job = { id:uid(), kind, deckId, then:then||null, status:"running", startedAt:Date.now() };
  jobs.push(job); saveJobs(); renderJobs();
  const name = deckNameOf(deckId);
  const sent = await sendToWorker({
    id:job.id, key, prompt,
    images:(files||[]).slice(0,8).map(f=>f.dataUrl.split(",")[1]),
    notify:{
      title:"QuickLearn",
      ok:`Your ${JOB_NAME[kind]} for “${name}” ${kind==="cards"?"are":"is"} ready`,
      fail:`Couldn't make your ${JOB_NAME[kind]} for “${name}”. Open QuickLearn to try again.`,
      hash:"#/deck/"+deckId
    }
  });
  if(!sent){ // no service worker (e.g. opened as a plain file): run it here instead
    gemini(prompt, files).then(
      text => completeJob(job.id, { ok:true, text }),
      err => completeJob(job.id, { ok:false, error:err.message })
    );
  }
  return job;
}

function applyJob(job, text){
  if(!data.decks.some(d=>d.id===job.deckId)) throw new Error("That deck was deleted.");
  const name = deckNameOf(job.deckId);
  if(job.kind === "cards"){
    const clean = (text||"").replace(/```json|```/g,"").trim();
    let arr;
    try{ arr = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]")+1)); }
    catch(_){ arr = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("}")+1) + "]"); } // reply was cut off: keep every complete card
    arr = arr.map(c => ({ question: stripMd(c.question), answer: stripMd(c.answer) }));
    const n = addCards(job.deckId, arr);
    return `${n} flashcards added to “${name}”`;
  }
  const note = cleanAiText(text || "");
  if(!note.trim()) throw new Error("The AI sent back an empty answer. Please try again.");
  data.notes.unshift({ id:uid(), deckId:job.deckId, content:note, createdAt: todayISO() });
  save();
  if(job.kind === "scan" && job.then) setTimeout(()=>aiAct(job.deckId, job.then), 60);
  const done = { improve:"Improved note saved", summarize:"Summary saved", scan:"Scanned note saved", refine:"Refined note saved" }[job.kind];
  return `${done} in “${name}”`;
}

function completeJob(id, res){
  const job = jobs.find(j=>j.id===id);
  if(!job || job.status !== "running") return;
  let ok = !!res.ok, msg;
  try{
    if(!ok) throw new Error(res.error || "Something went wrong.");
    msg = applyJob(job, res.text);
  }catch(e){ ok = false; msg = e.message || "Something went wrong."; console.error(e); }
  job.status = ok ? "done" : "error"; job.msg = msg; saveJobs();
  if(location.hash === "#/deck/"+job.deckId) route();       // refresh only if you're looking at that deck
  if(!ok) setOut(`<div class="panel" style="margin-top:.75rem;color:var(--destructive);font-size:.85rem">${esc(msg)}</div>`);
  else if(location.hash === "#/deck/"+job.deckId && !job.then) setOut("");
  if(document.hidden) notifyLocal("QuickLearn", ok ? msg : "Couldn't finish: "+msg, "#/deck/"+job.deckId);
  else { toast(ok ? msg : "Couldn't finish: "+msg, ok ? "success" : "error"); try{ navigator.vibrate && navigator.vibrate(ok ? 120 : [80,60,80]); }catch(_){} }
  if(ok) setTimeout(()=>{ jobs = jobs.filter(j=>j.id !== id); saveJobs(); renderJobs(); }, 6000);
  renderJobs();
}

async function collectJob(id){
  const job = jobs.find(j=>j.id===id && j.status==="running"); if(!job) return;
  try{
    const c = await caches.open(JOBS_CACHE);
    const r = await c.match("/__job/"+id); if(!r) return;
    const res = await r.json(); await c.delete("/__job/"+id);
    completeJob(id, res);
  }catch(_){}
}
async function checkJobs(){
  for(const j of jobs.filter(j=>j.status==="running")){
    await collectJob(j.id);
    if(j.status==="running" && Date.now()-j.startedAt > 12*60*1000) completeJob(j.id, { ok:false, error:"This was interrupted — please run it again." });
  }
}

let _jobSeen = {};
function renderJobs(){
  const root = document.getElementById("jobs-root"); if(!root) return;
  const ids = new Set(jobs.map(j=>j.id));
  const ghosts = [...root.children].filter(el=>el.dataset.id && !ids.has(el.dataset.id)).map(el=>{ const g = el.cloneNode(true); g.className = "jobpill out"; return g; });
  root.innerHTML = jobs.map(j => {
    const name = esc(deckNameOf(j.deckId)), what = JOB_NAME[j.kind];
    if(j.status === "running") return `<div class="jobpill" onclick="go('#/deck/${j.deckId}')"><span class="spin"></span><span class="t">Making ${what} for “${name}”…</span><button class="jx" onclick="event.stopPropagation();cancelJob('${j.id}')">Cancel</button></div>`;
    if(j.status === "done") return `<div class="jobpill ok" onclick="go('#/deck/${j.deckId}')"><span class="t">✓ ${esc(j.msg||"Done")}</span></div>`;
    return `<div class="jobpill err" onclick="dismissJob('${j.id}')"><span class="t">⚠ ${esc(j.msg||"Failed")}</span><span class="x">×</span></div>`;
  }).join("");
  [...root.children].forEach((el,i)=>{
    const j = jobs[i]; el.dataset.id = j.id;
    if(_jobSeen[j.id] !== j.status) el.classList.add("in");
  });
  _jobSeen = Object.fromEntries(jobs.map(j=>[j.id, j.status]));
  if(!motionReduced()) ghosts.forEach(g=>{ g.removeAttribute("onclick"); root.appendChild(g); setTimeout(()=>g.remove(), 240); });
}
function cancelJob(id){
  const job = jobs.find(j=>j.id===id); if(!job) return;
  jobs = jobs.filter(j=>j.id!==id); saveJobs(); renderJobs();
  (async()=>{
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      const sw = navigator.serviceWorker.controller || (reg && reg.active);
      if(sw) sw.postMessage({ type:"cancel", id });
      const c = await caches.open(JOBS_CACHE); await c.delete("/__job/"+id);
    }catch(_){}
  })();
  if(location.hash === "#/deck/"+job.deckId) setOut("");
  toast("Cancelled");
}
function dismissJob(id){ jobs = jobs.filter(j=>j.id!==id); saveJobs(); renderJobs(); }

if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    const m = e.data || {};
    if(m.type === "genDone") collectJob(m.id);
    if(m.type === "goto" && m.hash) go(m.hash);
  });
}
["startSession","startQuiz","startLesson"].forEach(n=>{ const f = window[n]; if(typeof f !== "function") return;
  window[n] = function(){ const r = f.apply(this, arguments); if(session || LS) enterView("goR"); return r; }; });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkJobs(); });
window.addEventListener("focus", checkJobs);
setInterval(()=>{ if(jobs.some(j=>j.status==="running")) checkJobs(); }, 4000);
jobs = jobs.filter(j => j.status === "running");   // stale finished/failed pills don't come back after a restart
saveJobs(); renderJobs(); checkJobs();
</script>
<script>
/* Automatically show the sign-in dialog when QuickLearn opens for a signed-out visitor. */
(function () {
  let handledInitialAuthState = false;
  let stopInitialAuthWatch = null;
  function showSignInIfNeeded(user) {
    if (handledInitialAuthState) return;
    handledInitialAuthState = true;
    if (typeof stopInitialAuthWatch === 'function') stopInitialAuthWatch();
    if (!user && typeof openAccountModal === 'function') openAccountModal();
  }
  window.addEventListener('load', function () {
    if (typeof quickLearnAuth !== 'undefined' && quickLearnAuth) {
      try {
        stopInitialAuthWatch = quickLearnAuth.onAuthStateChanged(showSignInIfNeeded, function () {
          if (!handledInitialAuthState) {
            handledInitialAuthState = true;
            if (typeof openAccountModal === 'function') openAccountModal();
          }
        });
      } catch (e) {
        if (typeof openAccountModal === 'function') openAccountModal();
      }
    } else if (typeof openAccountModal === 'function') {
      openAccountModal();
    }
  });
})();
</script>
